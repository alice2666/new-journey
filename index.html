<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>New Journey</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden; background: #000;
  }

  /* ---------- 视口：负责居中与等比缩放 ---------- */
  #viewport {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }

  /* ---------- 舞台：内部坐标严格 1200 x 896 ---------- */
  #stage {
    width: 1200px; height: 896px;
    flex: 0 0 auto;                    /* 关键：禁止被 flex 容器压缩，否则内部坐标系会被挤成窗口尺寸 */
    position: relative; overflow: hidden;
    background: #000;
    transform-origin: center center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    user-select: none; -webkit-user-select: none;
    cursor: default;
  }

  #stage img { display: block; -webkit-user-drag: none; }

  /* ---------- 场景层 ---------- */
  .scene { position: absolute; inset: 0; }
  /* 每一幕必须是「自包含的堆叠上下文」，否则幕内元素的 z-index 会跑到 #stage 层
     与其他幕的高层元素抢层级 —— 例如 #act4 的 #goal01(z=95) 会盖住 #act5(z=5)。
     成因：#act4 在 .active 时 opacity:1，就不再创建堆叠上下文了（opacity<1 才创建）。
     isolation:isolate 强制创建堆叠上下文，让幕内 z-index 全部被限制在本幕内。
     支持度：Chrome 41+ / Edge 15+ / Firefox 36+，与本页最低要求一致。 */
  .scene { isolation: isolate; }

  #act1 { opacity: 1; transition: opacity .4s ease-out; }
  #act1.out { opacity: 0; pointer-events: none; }

  /* act2 是覆盖在 act1 之上的全屏层：未激活时必须让点击穿透，
     否则 opacity:0 也会拦截点击，导致第一幕的 START 按钮点不动 */
  #act2 { opacity: 0; z-index: 2; transition: opacity .4s ease-out; pointer-events: none; }
  #act2.in { opacity: 1; pointer-events: auto; }

  /* ---------- 背景 ---------- */
  #bg-start, #bg-room {
    position: absolute; left: 0; top: 0;
    width: 1200px; height: 896px;
  }

  /* ---------- 淡入元素默认态 ---------- */
  #bg-start, #btn-start, #suitcase, #hand, #btn-go, #btn-go3, #blackout { opacity: 0; }
  #bg-start.in, #btn-start.in, #suitcase.in, #hand.in,
  #btn-go.in, #btn-go3.in, #blackout.in { opacity: 1; }

  /* ---------- 第一幕 START：水平居中，底边距画布底 170px ---------- */
  #btn-start {
    position: absolute;
    left: 486.5px; bottom: 170px;      /* 227x97 -> 中心 x = 600 */
    width: 227px; height: 97px;
    transform-origin: center center;
    transition: opacity .4s ease-out, transform .15s ease-out;
    pointer-events: none;
  }
  #btn-start.in { pointer-events: auto; cursor: pointer; }
  #btn-start.in:hover { transform: scale(1.05); }
  #btn-start.in:active { transform: scale(.95); }

  /* ---------- 对话弹窗：自下而上滑入并贴底 ----------
     抽成 .chat 公共类：第二幕 #chat 与第三幕 #chat3 共用同一套几何与动画
     （screen3/chat.png 与 screen2/chat.png md5 相同，无需重新定位）。
     id 保留不变，供既有断言与 JS 引用。 */
  .chat {
    position: absolute; left: 0; top: 400px;
    width: 1200px; height: 496px;
    z-index: 30;
    transform: translateY(110%);
    transition: transform .6s ease-out, opacity .35s ease-out;
    pointer-events: none;              /* 纯装饰，不拦截点击 */
  }
  .chat.in { transform: translateY(0); }
  /* 点击 GO 后：整个 chat.png（画面 + Luna 姓名牌 + 台词）整体淡出消失 */
  .chat.out { opacity: 0; }

  .chat-frame {
    position: absolute; left: 0; top: 0;
    width: 1200px; height: 496px;
    pointer-events: none;
  }

  /* 台词文本区。#chat 位于画布 top:400 且与画面底边贴齐（400 + 496 = 896），
     本元素的坐标是「弹窗内局部坐标」，换算成画布坐标：
       left 380px  -> 画布 x = 380（chat 的 left 为 0）
       top  370.4px -> 画布 y = 400 + 370.4 = 770.4（2 行时底边落在画布 y=846，
                       即底边距画面底 896-846 = 50px；原为 70，按需求整体下移 20px）
       width 640px -> 右边缘 = 画布 x 1020，距画面右 180px（让开 GO 按钮 x1062）
     ── 为什么用 top 锚定，而不是 bottom ──────────────────────────────
     「Luna」姓名牌占画布 y690-755 / x351-523，横向正压在文字左边界上方，
     所以文字「墨迹顶边」必须 >= 755 才不算压倒它。
     若用 bottom 锚定，行数一多文字就往上长：bottom=50 时 3 行墨迹顶边到 739，
     压住姓名牌 16px；bottom 再往下压到 28 才能让 3 行安全，但 2 行就明显偏下了。
     改成 top 锚定后，行数增加只向下生长 —— 2 行与 3 行的墨迹顶边恒为画布 y≈776.4
     （即原 756.4 下移 20px），既满足「2-3 行整体下移 20px」，
     又让 2/3 行都永不压牌、始终落在浅蓝底板上。
     ── 实测参照（均为画布坐标）────────────────────────────────────
     浅蓝底板上沿 y=718；姓名牌 x351-523 / y690-755；角色立绘最右 x=350；
     GO 按钮 x1062-1100 / y799-846。 */
  #chat-text, .chat-text {
    position: absolute;
    left: 380px;
    width: 640px;
    top: 370.4px;
    margin: 0;
    font-size: 28px; line-height: 1.35;
    font-weight: 600; letter-spacing: .2px;
    color: #123a72;
  }

  /* ---------- 行李箱：距右 50px，距底 30px ---------- */
  #suitcase {
    position: absolute;
    right: 50px; bottom: 30px;         /* 225x414 -> left 925, top 452 */
    width: 225px; height: 414px;
    z-index: 10;
    transform: translateY(20px);
    transition: opacity .45s ease-out, transform .45s ease-out;
    pointer-events: none;
  }
  #suitcase.in { transform: translateY(0); }
  #suitcase.clickable { pointer-events: auto; cursor: pointer; }
  #suitcase.clickable:hover {
    filter: brightness(1.06) drop-shadow(0 0 12px rgba(255,255,255,.65));
  }

  /* ---------- 引导手：指尖(7% 0%)为缩放原点，循环点按 ---------- */
  #hand {
    position: absolute;
    left: 989px; top: 548px;           /* 165x161 -> 指尖落在行李箱拉杆上 */
    width: 165px; height: 161px;
    z-index: 20;
    transform-origin: 7% 0%;
    pointer-events: none;
    transition: opacity .3s ease-out;
    animation: tap .9s ease-in-out infinite;
  }
  @keyframes tap {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(.85); }
  }

  /* ---------- 推进按钮：距右 100px，距底 50px（第二幕 #btn-go / 第三幕 #btn-go3 共用） ---------- */
  #btn-go, #btn-go3 {
    position: absolute;
    right: 100px; bottom: 50px;        /* 38x47 -> left 1062, top 799 */
    width: 38px; height: 47px;
    z-index: 40;
    transform-origin: center center;
    transition: opacity .3s ease-out, transform .15s ease-out;
    pointer-events: none;
  }
  #btn-go.in, #btn-go3.in { pointer-events: auto; cursor: pointer; }
  #btn-go.in:hover, #btn-go3.in:hover { transform: scale(1.15); }
  #btn-go.in:active, #btn-go3.in:active { transform: scale(.92); }

  /* ---------- 遮黑层 ---------- */
  #blackout {
    position: absolute; inset: 0;
    background: #000; z-index: 100;
    pointer-events: none;
    transition: opacity .7s ease-out;
  }
  #blackout.in { pointer-events: auto; }
  /* 幕间转场用 400ms 淡出（需求 §6.2） */
  #blackout.fast { transition-duration: .4s; }
  /* 透明但仍拦截点击：视频播放期间用它挡掉一切误触（需求 §8「视频播放期间完全屏蔽点击」）。
     必须放在 .in 之后：两者同特异性，靠声明顺序取胜。 */
  #blackout.guard { opacity: 0; pointer-events: auto; }

  /* ---------- 后续幕预留容器（保持为空） ----------
     原 #act6-slot 已升为第六幕实际容器 #act6（见下方「第六幕」段），这里不再保留同名空位。 */
  #act3-slot, #act7-slot { position: absolute; inset: 0; z-index: 110; pointer-events: none; }

  /* ==================================================================
     第三幕：贴纸定制（z-index 3，位于 #act2(2) 之上、#blackout(100) 之下）
     ================================================================== */
  /* 未激活时整幕必须不可见。
     注意：#bg-room-suitcase 是「常驻可见」的定格图（不像 #act3-video 那样自带 opacity:0），
     而 #act3 的 z-index(3) 高于 #act2(2) 与 #act1(auto)。若只写 z-index 不写 opacity，
     这张定格图会从页面载入的第一帧起就盖在第一、二幕之上 ——
     表现为「一打开就是行李箱的房间、看不到开始界面、画面怎么都不动」。
     激活那一刻 #blackout 仍是全黑，所以这里不加过渡、瞬时切换更安全。 */
  #act3 { opacity: 0; z-index: 3; pointer-events: none; }
  #act3.active { opacity: 1; pointer-events: auto; }
  /* 待放置贴纸时的光标反馈：箱身内 pointer，范围外 not-allowed */
  #act3.placing { cursor: not-allowed; }
  #act3.placing.on-body { cursor: pointer; }

  #bg-room-suitcase, #act3-video {
    position: absolute; left: 0; top: 0; width: 1200px; height: 896px;
  }
  /* 定格图常驻视频下层：视频结束时视频淡出即可露出它，末帧有细微差异也不会闪黑 */
  #bg-room-suitcase { z-index: 1; }
  #act3-video {
    z-index: 2;
    object-fit: fill;                  /* 1112x834 -> 1200x896，纵横比仅差 0.45% */
    opacity: 0;
    transition: opacity .25s ease-out;
  }
  #act3-video.in { opacity: 1; }

  /* 已落定的贴纸容器（箱身贴纸 z-index 10 起，按贴上顺序递增） */
  #sticker-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  #sticker-layer .placed {
    position: absolute; width: 142px; height: 119px;
    transform-origin: center center;
    animation: drop .18s ease-out;
  }
  @keyframes drop {
    from { transform: rotate(var(--rot, 0deg)) scale(1.12); }
    to   { transform: rotate(var(--rot, 0deg)) scale(1); }
  }

  /* 贴纸面板：距顶 45 / 距右 25 -> left 653 / top 45 */
  #sticker-panel { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
  #sticker-frame {
    position: absolute; left: 653px; top: 45px; width: 522px; height: 630px;
    transform: translateX(560px);      /* 初始完全在画布右侧之外：653+560 = 1213 > 1200 */
    transition: transform .6s ease-out;
  }
  #sticker-frame.in { transform: translateX(0); }

  /* 调色板 12 张贴纸：142x119，与面板槽位等尺寸，直接对位（坐标写在 HTML 内联样式） */
  .palette {
    position: absolute; width: 142px; height: 119px;
    opacity: 0;
    transition: opacity .4s ease-out, filter .2s ease-out;
    pointer-events: none;
  }
  .palette.in { opacity: 1; pointer-events: auto; cursor: pointer; }
  .palette.in:hover { filter: brightness(1.08) drop-shadow(0 0 10px rgba(255,255,255,.55)); }
  /* 已使用 / 待放置：置灰且不可再点（同一张贴纸不允许重复使用 —— Q15） */
  .palette.used { opacity: .35; filter: grayscale(1); pointer-events: none; cursor: default; }

  /* 手持 / 飞行层：待放置贴纸跟随光标 + 飞回取消的过渡元素 */
  #sticker-cursor { position: absolute; inset: 0; z-index: 45; pointer-events: none; }
  #sticker-cursor img {
    position: absolute; left: 0; top: 0;
    width: 142px; height: 119px;
    opacity: .85;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,.35));
    will-change: transform;
    pointer-events: none;
  }

  /* RESET / OK：距底 85 -> top 714；OK 距右 25 -> left 949，RESET 在 OK 左 70px -> left 652 */
  #btn-reset, #btn-ok {
    position: absolute; top: 714px; z-index: 40;
    transform: translateY(150px);      /* 初始完全在画布下沿之外：714+150 = 864，下边缘 961 > 896 */
    opacity: 0; pointer-events: none;
    transition: transform .5s ease-out, opacity .3s ease-out, filter .2s ease-out;
  }
  #btn-reset { left: 652px; width: 227px; height: 97px; }
  #btn-ok    { left: 949px; width: 226px; height: 97px; }
  #btn-reset.in, #btn-ok.in { transform: translateY(0); }
  #btn-reset.in { opacity: 1; pointer-events: auto; cursor: pointer; }
  #btn-reset.in:hover  { transform: translateY(0) scale(1.05); }
  #btn-reset.in:active { transform: translateY(0) scale(.95); }
  /* OK 出现后默认置灰禁用（贴纸数 < 3），≥ 3 才由 JS 切到 .ready */
  #btn-ok.in.dim   { opacity: .45; filter: grayscale(1); pointer-events: none; cursor: not-allowed; }
  #btn-ok.in.ready { opacity: 1; filter: none; pointer-events: auto; cursor: pointer; }
  #btn-ok.in.ready:hover  { transform: translateY(0) scale(1.05); }
  #btn-ok.in.ready:active { transform: translateY(0) scale(.95); }
  /* 入场动画跑完后切成快速过渡，hover 才不迟钝 */
  #btn-reset.in.settled, #btn-ok.in.settled { transition: transform .15s ease-out, opacity .2s ease-out, filter .2s ease-out; }

  /* 点击 OK 后第三幕 UI 整体淡出（shadow.png 是 70% 半透明，不淡出会透过蒙黑层若隐若现）。
     需求只要求「面板 + 调色板 + RESET/OK 按钮」淡出 —— 箱身上已落定的贴纸属于玩家的作品，
     刻意保留，让达成页里的行李箱仍是「装饰好的那一只」。 */
  #act3.ui-out #sticker-panel { opacity: 0; transition: opacity .3s ease-out; }
  #act3.ui-out #btn-reset,
  #act3.ui-out #btn-ok { opacity: 0; pointer-events: none; }

  /* ==================================================================
     第四幕：目标达成（z-index 4）
     ================================================================== */
  /* 与 #act3 同理：整幕默认不可见，激活时由脚本加 .active。
     目前 #act4 的子元素各自都有 opacity:0 门控，所以「漏门控」暂时看不出问题，
     但只要以后往这里加一个常驻可见的元素，就会立刻盖住全屏 —— 统一门控更安全。
     不放 pointer-events：点击仍由 #continue.in.ready 单独开启。 */
  #act4 { opacity: 0; z-index: 4; pointer-events: none; }
  #act4.active { opacity: 1; }
  /* shadow：第四幕蒙黑底图（把第三幕画面压暗凸显卡片）。
     ⚠️ v2.14（问题 1 / Q43）：撤场用的 0.4s 必须**短于**黑幕 `#blackout` 的 0.7s 淡入，
        否则黑幕跑完时它还剩一截半透明灰罩留在屏幕上（实测 600ms 时会残留 0.66）。 */
  #shadow {
    position: absolute; inset: 0; z-index: 90;
    opacity: 0; transition: opacity .6s ease-out;
  }
  #shadow.in { opacity: 1; }
  /* 撤场态（撤掉 .in 时一并挂上）：把 0.6s 的入场时长压到 0.4s 快速退清 */
  #shadow.out { opacity: 0; transition: opacity .4s ease-out; }
  /* goal01：水平居中 / 距顶 120 -> left 221 / top 120
     出现方式（用户指定）：**从上到下快速落下**。
     初始整张卡片在画布上方之外（下边缘 699 - 720 = -21 < 0），
     再沿 Y 轴加速落到位，落点即 top 120。ease-in 的加速段模拟自由落体，
     手感是「落」不是「滑」；opacity 只用 120ms 快速点亮，
     保证卡片一进入画布就已经可见，而不是落到位才浮现。 */
  #goal01 {
    position: absolute; left: 221px; top: 120px; width: 758px; height: 579px; z-index: 95;
    opacity: 0;
    transform: translateY(-720px);
    transition: transform .38s cubic-bezier(.55, 0, .85, .35), opacity .12s ease-out;
  }
  #goal01.in { opacity: 1; transform: translateY(0); }
  /* Continue：水平居中 / 距底 95 -> left 467.5 / top 770 */
  #continue {
    position: absolute; left: 467.5px; top: 770px; width: 265px; height: 31px; z-index: 96;
    opacity: 0;
    transform: translateY(120px);      /* 初始完全在画布下沿之外：770+120 = 890，下边缘 921 > 896 */
    transition: transform .5s ease-out, opacity .3s ease-out;
    pointer-events: none;
  }
  #continue.in { opacity: 1; transform: translateY(0); }
  /* ⚠️ v2.15（用户问题 1）：撤场态 —— 点 Continue 时把按钮也一起撤掉。
     病灶：黑幕 `.fast` 入场只有 0.4s，而 `#continue` 走 `#continue.in` 的 0.3s 淡出，
     黑幕跑完时它还残留约 0.15 —— 于是「Continue 按钮」会在户外定格图／室内图上
     一闪而过（用户看到的「多出来的一屏」）。加 `.out` 把退场压到 0.15s，跑在黑幕前面。 */
  #continue.out { opacity: 0; transform: translateY(0); transition: opacity .15s ease-out; }
  /* 第四幕唯一可点击元素（Q20：点击后才转全黑，不自动延时） */
  #continue.in.ready { pointer-events: auto; cursor: pointer; }
  #continue.in.ready:hover  { transform: translateY(0) scale(1.05); }
  #continue.in.ready:active { transform: translateY(0) scale(.95); }
  #continue.in.settled { transition: transform .15s ease-out, opacity .2s ease-out; }

  /* ==================================================================
     第五幕：古城堡（z-index 5，位于 #act4(4) 之上、#blackout(100) 之下）
     ==================================================================
     ⚠️ 门控是本版最高风险点（开发计划 §9.2 R19 / 需求 §9.1.1，D4 的翻版）：
     #bg-inside.png 是「常驻可见」的全屏定格图（1200x896，无透明通道），
     不像 #act5-video 那样自带 opacity:0。而 #act5 的 z-index(5) 高于前四幕，
     一旦容器漏写 opacity:0，这张图会从页面载入的第一帧起盖住所有画面。
     所以：容器默认 opacity:0 + .active 转可见；激活那一刻 #blackout 仍全黑，
     瞬时切换即可，不加过渡更安全（与 #act3 / #act4 同做法）。 */
  #act5 { opacity: 0; z-index: 5; pointer-events: none; }
  #act5.active { opacity: 1; pointer-events: auto; }

  /* 户外定格图（= 视频末帧）：本幕的户外背景层。
     注：video 元素仍保留在 DOM 中并注入 src（供「素材体检」与旧断言识别），
     但它带 .hidden 属性恒不参与渲染，户外视觉一律由这张定格图承担。 */
  #act5-video { display: none; }

  #act5-outdoor {
    position: absolute; left: 0; top: 0; width: 1200px; height: 896px;
    z-index: 1;
    opacity: 0;
    transition: opacity .4s ease-out;
  }
  #act5-outdoor.in { opacity: 1; }

  #bg-inside {
    position: absolute; left: 0; top: 0; width: 1200px; height: 896px;
    z-index: 2;
    opacity: 0;
    transition: opacity .4s ease-out;
  }
  #bg-inside.in { opacity: 1; }

  /* 第五幕两段对话弹窗：几何完全复用第二幕 .chat（同一份 screen2/chat.png） */
  #chat5a, #chat5b { z-index: 30; }
  /* 两段对话的 GO 按钮（跨幕复用 screen2/btn-go.png，共 4 处点击） */
  #btn-go5a, #btn-go5b {
    position: absolute;
    right: 100px; bottom: 50px;        /* 38x47 -> left 1062, top 799 */
    width: 38px; height: 47px;
    z-index: 40;
    transform-origin: center center;
    opacity: 0;
    transition: opacity .3s ease-out, transform .15s ease-out;
    pointer-events: none;
  }
  #btn-go5a.in, #btn-go5b.in { opacity: 1; pointer-events: auto; cursor: pointer; }
  #btn-go5a.in:hover, #btn-go5b.in:hover { transform: scale(1.15); }
  #btn-go5a.in:active, #btn-go5b.in:active { transform: scale(.92); }

  /* 地上的纸片：距右 300 / 距底 180（原 290 / 120，本轮上移 60、左移 10）
     B4 出现时淡入但不可点（对话正在进行）；B7 引导手出现后才变可点。
     层序：纸片 z=40，引导手 z=45 —— 手必须压在纸片之上（问题 3）。 */
  #btn-papers {
    position: absolute; left: 705px; top: 593px; width: 195px; height: 123px;
    z-index: 40;
    opacity: 0;
    transition: opacity .4s ease-out, transform .15s ease-out, filter .2s ease-out;
    pointer-events: none;
  }
  #btn-papers.in { opacity: 1; }
  /* 只有进入 B7 才放开点击（否则对话期间点击纸片会打断流程） */
  #btn-papers.in.clickable { pointer-events: auto; cursor: pointer; }
  #btn-papers.in.clickable:hover { transform: scale(1.05); }
  #btn-papers.in.clickable:active { transform: scale(.96); }

  /* 第五幕引导手：复用 screen2/hand.png，指尖(transform-origin 7% 0%)指向纸片。
     实测 hand.png 的指尖像素 = (11, 0)，即 7% × 165 ≈ 11.55，与 transform-origin 一致。
     纸片外接框 = left 705 / top 593 / 195x123，中心 = (802.5, 654.5)。
     指尖画布坐标 = (left + 11.55, top)：
       取 left = 791 -> 指尖 x ≈ 802.6（对准纸片横向中心）
       取 top  = 596 -> 指尖 y = 596，落在纸片上沿（593）**之内** 3px，
                        是「指尖点住纸片上沿」的姿态（v2.14 用户要求：原文案 536 下移 60）。
     ⚠️ 层序（问题 3）：z-index 45 —— 必须**高于**纸片(40)、**低于**黑幕(100)；
        此幕的对话层(z=30)与 GO(z=40)在 B7 时已淡出，提层不会引发遮挡。
        hand5 带 pointer-events:none，层级提升不影响纸片的点击命中。 */
  #hand5 {
    position: absolute; left: 791px; top: 596px;
    width: 165px; height: 161px;
    z-index: 45;
    opacity: 0;
    transform-origin: 7% 0%;
    pointer-events: none;
    transition: opacity .3s ease-out;
    animation: tap .9s ease-in-out infinite;
  }
  #hand5.in { opacity: 1; }

  /* ==================================================================
     第六幕：拼碎纸 / 修复古画（z-index 6；需求 §9）
     ==================================================================
     ⚠️ 门控是本幕最高风险点（开发计划 §4.1 / R24 —— D4 的第三次翻版）：
     #bg-picture(1200x896) 与 #frame-picture(356x896，主体 α=255) 都是
     「常驻不透明」的全屏 / 半屏图，而 #act6 的 z-index(6) 高于全部前五幕。
     容器一旦漏写 opacity:0，它们会从页面载入的第一帧起盖住整部 Demo。
     所以：容器默认 opacity:0 + .active 转可见；激活那一刻 #blackout 仍全黑，
     瞬时切换即可，不加过渡更安全（与 #act3 / #act4 / #act5 同做法）。

     幕内层级一律照需求 §10.1：
       1 木桌 < 2 右侧底板 < 3 画框底罩 < 4 静态底 < 10 已落位碎片
       < 30 完成态整图 < 40 两钮 < 41 参考图 < 60 拖拽层
       < 90 蒙黑 < 95 Goal 2 < 96 Continue
     ⚠️ 四条例外关系别写反：
       ① 底板(2) 必须**低于**碎片(10) —— 底板主体不透明，写反了碎片会被整个盖住，
          画面表现为「碎片不见了、只剩一块空底板」；
       ② picture-line(3) 必须**低于**静态底(4) —— 它是平均 35% 的深色罩，
          写反了拼好的画会被整体罩暗；
       ③ 拖拽层(60) 必须**高于**底板(2) / 碎片(10) / 整图(30) ——
          碎片要从底板上被「拿起来」并跨过木桌区飞向画框；
       ④ 蒙黑层(90) 必须**高于**幕内全部画面元素（整图 30 / 两钮 40 / 参考图 41）——
          Q55 取消了「UI 淡出」这条退路后，层级成了唯一的视觉控制手段，
          写反会变成「古画被压暗、两个彩色圆钮反而亮着」，与需求效果正好相反。 */
  #act6 { opacity: 0; z-index: 6; pointer-events: none; }
  #act6.active { opacity: 1; pointer-events: auto; }

  /* 第六幕的按钮组（btn-again / btn-picture / continue6）：统一以中心缩放 */
  .btn6 { transform-origin: center center; }

  /* ---------- C1：木桌 + 画框底罩 + 静态底 ---------- */
  /* 木桌背景是本幕「一开始就在」的常驻底（幕内 z 1）。
     它的出场**完全由黑幕淡出完成**，刻意不像第五幕的 #bg-inside 那样自带淡入 ——
     否则黑幕淡完之后画面还是空的，再等 300ms 才浮出木桌（照抄第五幕会踩这个坑）。 */
  #bg-picture {
    position: absolute; left: 0; top: 0; width: 1200px; height: 896px;
    z-index: 1;
  }
  /* 画框底罩 + 描边（646x522 = 沿 640x517 的整图左/上/右/下各外扩 3px）：
     一层平均 35% 的深色罩，必须垫在静态底**之下**（见上面例外关系 ②）。 */
  #picture-line {
    position: absolute; left: 175px; top: 124px; width: 646px; height: 522px;
    z-index: 3;
    opacity: 0;
    transition: opacity .3s ease-out;
  }
  #picture-line.in { opacity: 1; }
  /* 静态底 = 整图**减去**这 9 张碎片后剩下的部分（实测与拼合结果严丝合缝）。
     piece-many 与 all-picture 在素材里是逐像素同源的 640x517 图，
     Q47 定案：两者**必须同槽**，统一取 178 / 126。 */
  #piece-many {
    position: absolute; left: 178px; top: 126px; width: 640px; height: 517px;
    z-index: 4;
    opacity: 0;
    transition: opacity .3s ease-out;
  }
  #piece-many.in { opacity: 1; }

  /* ---------- C2：右侧碎片底板 + 两个圆钮 + 参考缩略图 ---------- */
  /* 底板 356x896 盖住木桌右半边（x 844-1200），主体完全不透明 ——
     所以「碎片必须在它之上」（碎片 10 > 底板 2）是硬要求（见例外关系 ①）。 */
  #frame-picture {
    position: absolute; left: 844px; top: 0; width: 356px; height: 896px;
    z-index: 2;
    transform: translateX(356px);      /* 初始完全在画布右侧之外：844 + 356 = 1200 */
    transition: transform .6s ease-out;
  }
  #frame-picture.in { transform: translateX(0); }

  /* 两个圆钮：btn-again 在左上（52/15）、btn-picture 在左下（52/703），
     均**自左向右**滑入 500ms（btn-picture 错峰 100ms）。
     ⚠️ 初始 translateX(-120px) 只把左边缘推到 -68，右边缘仍在画布内 35px，
        所以**必须**同时用 opacity:0 藏住 —— 只写 transform 会露出一条边。 */
  #btn-again, #btn-picture {
    position: absolute; left: 52px;
    width: 103px; height: 113px;
    z-index: 40;
    opacity: 0;
    transform: translateX(-120px);
    transition: opacity .5s ease-out, transform .5s ease-out, filter .2s ease-out;
    pointer-events: none;
  }
  #btn-again  { top: 15px; }
  #btn-picture { top: 703px; }
  #btn-again.in, #btn-picture.in {
    opacity: 1; transform: translateX(0);
    pointer-events: auto; cursor: pointer;
  }
  /* 入场动画跑完后切成快速过渡，hover 才不迟钝 */
  #btn-again.in.settled, #btn-picture.in.settled {
    transition: transform .15s ease-out, opacity .2s ease-out, filter .2s ease-out;
  }
  #btn-again.in.settled:hover, #btn-picture.in.settled:hover { transform: scale(1.06); filter: brightness(1.06); }
  #btn-again.in.settled:active, #btn-picture.in.settled:active { transform: scale(.95); }
  /* ⚠️ v2.20 · Q56：C5 蒙黑一出现，两钮「视觉保留（被压暗）、功能不可点击」。
     必须放在上面 .in 之后 —— 同特异性（1 个 id + 1 个 class），靠声明顺序取胜。
     ⚠️ 绝不可改成给 #act6 整幕设 pointer-events:none：C3 的拖拽与 Continue
        都依赖真实点击（这是与第四幕「整幕屏蔽、只放行 #continue」的关键差异）。 */
  #btn-again.dead, #btn-picture.dead { pointer-events: none; cursor: default; }

  /* 参考缩略图（256x206）：画框**下方**的木桌面上，与拼图区不重叠。
     pointer-events:none 写死 —— 否则它会挡住底板上的碎片，拖不起来。 */
  #small-picture {
    position: absolute; left: 180px; top: 666px; width: 256px; height: 206px;
    z-index: 41;
    opacity: 0;
    transition: opacity .3s ease-out;
    pointer-events: none;
  }
  #small-picture.in { opacity: 1; }

  /* ---------- C3：已落位碎片层 + 拖拽层 ---------- */
  /* 两层都写成「铺满画布的空定位容器」：碎片于是以**画布坐标**为 left/top，
     开发计划 §5.5 的数值可以直接用；「拿起 = 换父节点」时坐标语义也不变。 */
  #piece-layer {
    position: absolute; left: 0; top: 0; width: 1200px; height: 896px;
    z-index: 10; pointer-events: none;
  }
  #piece-drag {
    position: absolute; left: 0; top: 0; width: 1200px; height: 896px;
    z-index: 60; pointer-events: none;
  }
  /* 碎片（9 张，由 JS 动态创建）：
     · 只做「淡入」与「拿起时放大到 1.05」两种过渡 —— **绝不做旋转 / 落定缩放**
       （9 张是 all-picture 的 1:1 精确同位裁剪，转了就不严丝合缝，与第三幕贴纸正好相反）；
     · left/top 的过渡**只在吸附 / 飞回时临时挂上**（inline），跟随期间必须是 none，
       否则每一帧都追赶，画面拖影（第三幕跟随踩过同一个坑）。 */
  #act6 .piece {
    position: absolute;
    opacity: 0;
    transform: scale(1);
    transition: opacity .4s ease-out, transform .15s ease-out;
    pointer-events: none;
  }
  #act6 .piece.in { opacity: 1; pointer-events: auto; cursor: grab; }
  #act6 .piece.lift {
    pointer-events: none;
    cursor: grabbing;
    transform: scale(1.05);
    filter: drop-shadow(0 10px 20px rgba(0, 0, 0, .45));
  }

  /* ---------- C4：完成态整图 + 循环发光 ---------- */
  /* 9/9 之后淡入，盖在拼合结果之上 —— 拼合残差（全图平均 0.395/255，集中在碎片边缘
     的抗锯齿过渡带）被这一盖彻底抹平，画面上就是一张干净完整的古画。 */
  #all-picture {
    position: absolute; left: 178px; top: 126px; width: 640px; height: 517px;
    z-index: 30;
    opacity: 0;
    transition: opacity .4s ease-out;
    pointer-events: none;
  }
  #all-picture.in { opacity: 1; }
  /* 发光只能由 CSS 实现（素材里没有「发光版」整图，本 Demo 零依赖、不新增素材）。
     ⚠️ v2.19 · Q54：9/9 之后**常驻不熄灭**，进入 C5 也**不摘除** ——
        它只是随后被 #shadow6（70% 蒙黑）整体压暗。 */
  @keyframes picGlow {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(255, 240, 180, .55)) brightness(1); }
    50%      { filter: drop-shadow(0 0 18px rgba(255, 240, 180, .95)) brightness(1.12); }
  }
  #all-picture.glow { animation: picGlow 1.6s ease-in-out infinite; }
  /* 🆕 问题2（需求 v2.22 · Q58）：all-picture 出现时**整体放大再缩回原尺寸**（一次性的「弹一下」）。
     ⚠️ 两个坑：
        ① `.pop` 与 `.glow` 会**同帧**挂上（runAct6Finish 里 `.in` / `.pop` 同一拍加类，
           紧接着的 `anim(0, ...)` 再加 `.glow`）。而 CSS 的 `animation` 是**整体替换、不叠加** ——
           若只写两条同特异性的规则，按「后定义者胜」会**静默吃掉一个动画**（要么不弹、要么不发光）。
           所以必须显式给出 `.pop.glow` 的组合规则（特异性更高）。
        ② 「等淡入走完再弹」用 **keyframes 内部的前 40% 原地不动** 表达，**不用 `animation-delay`
           + `fill-mode`** —— 后者会让 `transform` 被动画的填充值长期接管，留下隐性状态。
     ⚠️ `.pop` 类**挂上后不摘除**（见 runAct6Finish 的注释）：动画 `1` 次迭代、无 fill-mode，
        播完 transform 自然回落到 CSS 声明态；若用 `animationend` 摘类，会让**同帧并存的
        `picGlow` 被重启**（相位从 59% 跳回 0%），那是一次肉眼可见的亮度闪。
     ⚠️ `transform-origin` 保持默认的 `50% 50%`（= 320px 258.5px）→ 围绕**画心**缩放，
        布局坐标（`left/top`）全程不变，因此「整体放大」不会把画挪位。 */
  @keyframes picPop {
    0%, 40% { transform: scale(1); }        /* 0–400ms 与 `.in` 的 400ms 淡入重叠：先原地不动 */
    70%     { transform: scale(1.08); }     /* 400–700ms：放大 */
    100%    { transform: scale(1); }        /* 700–1000ms：缩回原尺寸 */
  }
  #all-picture.pop { animation: picPop 1s ease-in-out 1; }
  #all-picture.pop.glow { animation: picPop 1s ease-in-out 1,
                                    picGlow 1.6s ease-in-out infinite; }

  /* ---------- C5：蒙黑 + 第二张 Goal 卡 + Continue（整套复用第四幕） ----------
     ⚠️ 三件必须在 #act6 内**新建**，绝不可复用 #act4 的 #shadow / #goal01 / #continue ——
        #act4(z=4) **低于** #act6(z=6)，它内部的 90/95/96 层遮不住本幕画面。
     ⚠️ 三件**各自**必须自带 opacity:0 门控：幕级 .active 从 C1 起就常驻、兜不住它们。
        尤其 #shadow6 是 1200x896、平均 α≈70% 的整幅蒙黑图，漏门控会让第六幕
        从黑幕淡出的第一帧起就是灰的 —— 而玩家只会说「画面怎么是灰的」，极难归因。 */
  #shadow6 {
    position: absolute; inset: 0; z-index: 90;
    opacity: 0;
    transition: opacity .6s ease-out;
    /* ⚠️ 必须显式关掉命中测试：opacity:0 **不阻止**元素接收指针事件。
       本幕与第四幕的关键差异就在这里 —— 第四幕的 #shadow 躲在 `#act4`（整幕
       pointer-events:none）里，天然不会被点到；而本幕的 #act6 **必须保持可点**
       （C3 拖拽与 Continue 都要真实点击），于是这层 1200x896、z=90 的蒙黑图
       会在 C1~C4 期间**吞掉全幕的每一次按下**，表现为「碎片怎么拖都拖不动、
       两个圆钮也点不动」，而所有坐标 / 类名 / opacity 断言却全是绿的。 */
    pointer-events: none;
  }
  #shadow6.in { opacity: 1; }
  /* 撤场态（撤掉 .in 时一并挂上）：把 0.6s 的入场时长压到 0.4s 快速退清（D8） */
  #shadow6.out { opacity: 0; transition: opacity .4s ease-out; }

  /* goal02：与 goal01 同模板同尺寸，坐标一并沿用 221 / 120（Q52「复用第四幕位置」）。
     动作同样是「从上到下快速落下」：初始整张在画布上方之外
     （下边缘 699 - 720 = -21 < 0），opacity 只用 120ms 快速点亮 ——
     保证卡片一进入画布就已可见，而不是落到位才浮现。 */
  #goal02 {
    position: absolute; left: 221px; top: 120px; width: 758px; height: 579px;
    z-index: 95;
    opacity: 0;
    transform: translateY(-720px);
    transition: transform .38s cubic-bezier(.55, 0, .85, .35), opacity .12s ease-out;
    /* 同 #shadow6：opacity:0 不阻止命中。这张 758x579 的卡片在画布上方之外时无所谓，
       但它一落下来就正好压住左侧画框区（178/126~818/643）—— 若不禁用命中，
       C5 期间以及任何卡片“已在位”的时刻都会吞掉本该落到碎片上的按下。 */
    pointer-events: none;
  }
  #goal02.in { opacity: 1; transform: translateY(0); }

  /* Continue：同样沿用第四幕坐标 467.5 / 770（Q52）。
     滑入 500ms；**滑完**才由 JS 加 .ready 放开点击。 */
  #continue6 {
    position: absolute; left: 467.5px; top: 770px; width: 265px; height: 31px;
    z-index: 96;
    opacity: 0;
    transform: translateY(120px);      /* 初始完全在画布下沿之外：770+120 = 890，下边缘 921 > 896 */
    transition: transform .5s ease-out, opacity .3s ease-out;
    pointer-events: none;
  }
  #continue6.in { opacity: 1; transform: translateY(0); }
  /* 撤场态：黑幕走 .fast（0.4s 入场），而 #continue6.in 的淡出是 0.3s ——
     若点击后把按钮留在 .in 上，黑幕跑完时它还残留约 0.15。加 .out 压到 0.15s，
     跑在黑幕前面（D8 第三次实例）。 */
  #continue6.out { opacity: 0; transform: translateY(0); transition: opacity .15s ease-out; }
  /* C5 期间唯一可点击元素 */
  #continue6.in.ready { pointer-events: auto; cursor: pointer; }
  #continue6.in.ready:hover  { transform: translateY(0) scale(1.05); }
  #continue6.in.ready:active { transform: translateY(0) scale(.95); }
  #continue6.in.settled { transition: transform .15s ease-out, opacity .2s ease-out; }

  /* ---------- 启动失败兜底提示 ----------
     本页所有元素默认 opacity:0，靠 JS 加 .in 才显示。
     脚本一旦没跑起来，页面就是「全黑 + 点不动 + 毫无提示」，
     所以这里必须给一块能被看见的说明，别让问题停留在猜测阶段。
     注意：此处刻意不用 inset / flex 等较新特性，因为它要覆盖的正是旧浏览器。 */
  #fallback {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0;
    z-index: 9999;
    background: #10161f; color: #e9eef7;
    padding: 40px 48px;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.8;
    overflow: auto;
    text-align: left;
  }
  #fallback[hidden] { display: none; }
  #fallback h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; color: #ffd166; }
  #fallback .fb-sub { margin: 0 0 22px; color: #9fb0c8; font-size: 13px; }
  #fallback .fb-row { margin: 0 0 10px; }
  #fallback .fb-k { display: inline-block; min-width: 92px; color: #7f8ea6; }
  #fallback code {
    background: #1c2634; border: 1px solid #2b3646; border-radius: 4px;
    padding: 1px 6px; font-family: Consolas, Menlo, monospace; font-size: 13px; color: #8fd3ff;
  }
  #fallback pre {
    margin: 18px 0 0; padding: 14px 16px;
    background: #0a0e14; border: 1px solid #26313f; border-radius: 6px;
    color: #ff9d8a; font-family: Consolas, Menlo, monospace; font-size: 12.5px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow: auto;
  }
  #fallback .fb-tip {
    margin: 22px 0 0; padding: 14px 16px;
    background: #16202c; border-left: 3px solid #ffd166; border-radius: 4px; color: #cfe0f5;
  }
</style>
</head>
<body>

<!-- ===== 启动失败时的可见说明 =====
     本页所有元素默认 opacity:0，靠脚本加 .in 才显示；
     脚本一旦没跑起来，用户只会看到一片黑且点不动、且毫无提示。
     所以下面两块的存在意义就是：把「黑屏」换成「能读的病因」。 -->

<script>
(function () {
  'use strict';

  /* ================= 启动兜底（防「静默黑屏」） =================
     本页所有元素默认 opacity:0，只有脚本加上 .in 才会显示。
     也就是说：脚本没跑起来 = 全黑 + 点不动 + 且没有任何提示 —— 这是最难自行排查的状态。
     所以第一件事是自检，把病因直接写到屏幕上，而不是让用户对着黑屏猜。 */
  var fallbackBox = document.getElementById('fallback');

  function reportFailure(title, detail, missing) {
    try { console.error('[new-journey] ' + title + (detail ? ' :: ' + detail : '')); } catch (e) { /* 忽略 */ }
    if (!fallbackBox) return;
    function put(id, val) {
      var el = document.getElementById(id);
      if (el && val !== undefined && val !== null) el.textContent = String(val);
    }
    put('fb-title', title);
    put('fb-detail', detail || '');
    put('fb-missing', missing || '—');
    try {
      put('fb-ua', navigator.userAgent);
      put('fb-proto', location.protocol === 'file:' ? 'file:// （双击打开本地文件）' : location.protocol);
      put('fb-size', window.innerWidth + ' × ' + window.innerHeight);
      put('fb-scale', window.devicePixelRatio);
    } catch (e) { /* 忽略 */ }
    fallbackBox.hidden = false;
  }

  // 引擎能力自检：这 4 项任一缺失，后面的动画必然跑不起来（比如 IE11 就缺 Promise / closest）
  var lack = [];
  if (typeof Promise !== 'function') lack.push('Promise');
  if (!document.documentElement.classList) lack.push('classList');
  if (typeof window.requestAnimationFrame !== 'function') lack.push('requestAnimationFrame');
  if (typeof Element === 'undefined' || !Element.prototype.closest) lack.push('Element.closest');

  if (lack.length) {
    reportFailure(
      '浏览器版本过旧',
      '当前浏览器缺少：' + lack.join('、') + '。\n本页需要 Chrome 41+ / Edge 15+ / Firefox 44+，请改用最新版的 Chrome 或 Edge 打开。',
      lack.join('、')
    );
    return;   // 到此为止，不继续执行后面的动画逻辑
  }

  /* ================= 启动看门狗 + 素材体检 =================
     ① 看门狗：preload 完成前本来就是纯黑，属正常；若 6s 后第一幕仍未显示，说明中途卡住了。
     ② 素材体检：还有一种更隐蔽的失败 —— 脚本跑得好好的、.in 类名也加了，
        但图片根本没解码出来（资源 404 / 路径不对），画面照样是全黑。
        所以既要查「有没有跑起来」，也要查「图有没有真的出来」。 */
  var booted = false;
  window.__njMarkBooted = function () { booted = true; };

  // 首屏 7 个素材对应的元素。第三、四幕是懒加载，此处刻意不查，避免误报。
  function brokenAssets() {
    var ids = ['bg-start', 'btn-start', 'bg-room', 'suitcase', 'hand', 'chat-frame', 'btn-go'];
    var bad = [];
    for (var i = 0; i < ids.length; i++) {
      var el = document.getElementById(ids[i]);
      // 只报「已加载完、但确实没有像素」的；仍在加载中的不算
      if (el && el.tagName === 'IMG' && el.complete && !el.naturalWidth) {
        bad.push(el.getAttribute('src') || ids[i]);
      }
    }
    return bad;
  }

  setTimeout(function () {
    var bad = brokenAssets();
    if (bad.length) {
      reportFailure(
        '素材未能加载',
        '第一幕的图片没能显示（共 ' + bad.length + ' 个）：\n  ' + bad.join('\n  ') +
        '\n\n本页需要 index.html 与 assets/ 目录保持在同一个文件夹内。\n当前地址：' + location.href
      );
      return;
    }
    if (!booted) {
      reportFailure(
        '启动超时',
        '脚本已执行，但 6 秒内仍未渲染出第一幕。\n当前地址：' + location.href
      );
    }
  }, 6000);

  /* ================= 常量 ================= */
  var STAGE_W = 1200;
  var STAGE_H = 896;

  var AUDIO_SRC = 'audio/toggle.wav';
  var BGM_SRC = 'audio/music-walker-s.wav';   // 30.0s / PCM 16bit / 44.1kHz / 立体声 / 5.05MB
  var VIDEO_SRC = 'assets/screen3/suitcase-move.mp4';
  var VIDEO5_SRC = 'assets/screen5/oldbuilding-move.mp4';   // 第五幕开场视频（与第三幕同规格）

  var LINE1 = 'Wow! I’m traveling somewhere new. Let me get ready.';
  var LINE2 = 'This brand-new suitcase has no marks. Someone might take it by mistake.';
  var LINE3 = 'Let’s add our favourite stickers. Now it will be our exclusive suitcase!';
  /* 第五幕四句（全片第 ④–⑦ 句，含弯引号 ’）—— 需求 §8.3 / §8.6 原样保留 */
  var LINE4 = 'After over 30 hours of flight, I finally reach this ancient castle.';
  var LINE5 = 'I wonder what stories unfolded here. Let’s go in.';
  var LINE6 = 'Wow, stepping inside feels like traveling back in time.';
  var LINE7 = 'Huh, there are scraps of paper on the floor. What could they be?';

  var TYPE_SPEED = 40;        // ms / 字
  var CLICK_COOLDOWN = 300;

  /* ---- 第三幕贴纸玩法（自由落点 Q14 / Q24 / Q25） ---- */
  var STICKER_W = 142;        // 贴纸素材原尺寸，与面板槽位完全等尺寸，不缩放
  var STICKER_H = 119;
  /* 行李箱「可显示范围」（Q25）：由用户给定的红框实测换算而来（截图 819×619 → 画布 1200×896）。
     判据是「**整张贴纸**必须完整落在这个框内」，任一边越界即「超出范围」→ 飞回原位不计数。
     注意这与旧版「只判点击点（= 贴纸中心）」是两回事：旧版允许贴纸压出框外最多 71 / 59.5px。 */
  var DROP_BOX = { left: 146, right: 540, top: 259, bottom: 793 };
  /* 贴纸**中心**的可落点区间 = 红框四边各内缩半个贴纸 */
  var DROP = {
    left:   DROP_BOX.left   + STICKER_W / 2,
    right:  DROP_BOX.right  - STICKER_W / 2,
    top:    DROP_BOX.top    + STICKER_H / 2,
    bottom: DROP_BOX.bottom - STICKER_H / 2
  };
  var OK_THRESHOLD = 3;       // 箱身贴纸数 ≥ 3 时 btn-ok 可用（Q16）
  var RISE_MS = 200;          // 选中升起
  var FLY_MS = 250;           // 落定过渡 / 飞回取消
  var STICKER_FADE_MS = 400;
  var STICKER_STAGGER_MS = 40;  // 12 张贴纸错峰浮现间隔（Q23）

  /* 首屏只加载第一、二幕（3.8MB）；
     三、四幕（合计 6.4MB，视频独占 4.54MB）留到第二幕末尾并行预加载 */
  var IMAGES = [
    'assets/screen1/bg-start.png',
    'assets/screen1/btn-start.png',
    'assets/screen2/bg-room.png',
    'assets/screen2/chat.png',
    'assets/screen2/btn-go.png',
    'assets/screen2/suitcase.png',
    'assets/screen2/hand.png'
  ];

  var ACT34_IMAGES = [
    'assets/screen3/bg-room-suitcase.png',
    'assets/screen3/chat.png',
    'assets/screen3/sticker-frame.png',
    'assets/screen3/btn-reset.png',
    'assets/screen3/btn-ok.png',
    'assets/screen4/shadow.png',
    'assets/screen4/goal01.png',
    'assets/screen4/Continue.png'
  ];

  /* 第五幕（≈ 11.8MB，户外定格图 + 室内背景占大头）：在第四幕末尾转场期间并行预加载。
     chat.png / btn-go.png / hand.png 已在首屏队列里加载过（第二幕用过），不重复预取。
     注：outdoor-still.png 是「视频末帧的静帧」，本轮起取代视频直接担任户外背景层；
     video5 仅保留在 DOM 中供素材体检与识别（display:none，不渲染）。 */
  var ACT5_IMAGES = [
    'assets/screen5/outdoor-still.png',
    'assets/screen5/bg-inside.png',
    'assets/screen5/btn-papers.png'
  ];

  /* ================= 第六幕：拼碎纸 / 修复古画（需求 §9） =================
     3 波 × 3 张，顺序照需求 §9.5.1（文件名后缀 -01 / -02 / -03 恰对应波次）。
     每张碎片的坐标**直接取开发计划 §5.5 的两张表**，不再二次换算：
       trayX / trayY = 右侧底板上的初始位置（C 表；Q48 = 底板内纵向 3 等分居中
                        + 每张水平居中于底板中心 x = 1022，原尺寸摆放不缩放）
       goalX / goalY = 拖到左侧画框后的目标位置（B 表；像素级邻域精扫最优值，

     「目标中心」= (goalX + w/2, goalY + h/2)，供命中判定与断言使用 ——
     9 个目标中心**两两最近 68.0px**（03-02 ↔ 06-03），容差 30px 不到其一半。 */
  var PUZZLE_DIR = 'assets/screen6/';
  var PUZZLE_WAVES = [
    ['picture-01-01', 'picture-11-01', 'picture-05-01'],   // 第 1 波
    ['picture-03-02', 'picture-09-02', 'picture-10-02'],   // 第 2 波
    ['picture-06-03', 'picture-04-03', 'picture-08-03']    // 第 3 波
  ];
  var PUZZLE_PIECES = {
    'picture-01-01': { w: 241, h: 128, trayX: 901.5, trayY:  85.3, goalX: 178, goalY: 127 },
    'picture-11-01': { w: 291, h: 158, trayX: 876.5, trayY: 369.0, goalX: 334, goalY: 485 },

     跟随定位与落点判定必须走同一套换算后的坐标，否则会出现「看着能贴、实际贴不上」。 */

    var r = stage.getBoundingClientRect();
    var s = r.width / STAGE_W;            // 缩放比直接从 rect 反推，不依赖外部状态

  /* ================= 打字机 ================= */
  function typeText(text, speed, target) {
    speed = speed || TYPE_SPEED;
    target = target || chatText;
    busy = true;
    var my = ++typeToken;
    target.textContent = '';

    return new Promise(function (resolve) {
      var startT = null;
      var shown = 0;

      function frame(t) {
        if (my !== typeToken) {           // 被打断
          busy = false;
          return resolve(false);
        }
        if (startT === null) startT = t;

        var n = Math.floor((t - startT) / speed);
        if (n > text.length) n = text.length;

        if (n !== shown) {
          shown = n;
          target.textContent = text.slice(0, n);
        }
        if (shown >= text.length) {
          busy = false;
          return resolve(true);
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });
  }

  // 把「中心点」换算成跟随层的 transform（贴纸以中心对齐光标）
  function xf(cx, cy, scale) {
    return 'translate3d(' + (cx - STICKER_W / 2) + 'px,' + (cy - STICKER_H / 2) + 'px,0)' +
           (scale === undefined ? '' : ' scale(' + scale + ')');
  }

  // ① 选中升起 → 转为跟随光标
  function startPlacing(item, at) {
    item.used = true;
    item.el.classList.add('used');            // 面板中置灰，不再可点（Q15）

    var slotCx = item.left + STICKER_W / 2;
    var slotCy = item.top + STICKER_H / 2;
    var p = at || { x: slotCx, y: slotCy };

    var img = document.createElement('img');
    img.src = item.src;
    img.alt = '';
    img.style.transition = 'none';
    img.style.transform = xf(slotCx, slotCy, 0.9);   // 起点 = 槽位（略缩 0.9，表示「拿起来了」）
    stickerCursor.appendChild(img);

    placing = { item: item, el: img, x: p.x, y: p.y };
    act3.classList.add('placing');
    act3.classList.toggle('on-body', inBody(p.x, p.y));

    requestAnimationFrame(function () {
      if (!placing || placing.el !== img) return;
      img.style.transition = 'transform ' + RISE_MS + 'ms ease-out';
      img.style.transform = xf(p.x, p.y, 0.9);
      setTimeout(function () {
        // 跟随时必须去掉过渡，否则每一帧都追赶，画面拖影
        if (placing && placing.el === img) img.style.transition = 'none';
      }, RISE_MS + 20);
    });
  }

  function cancelPlacing(instant) {
    if (!placing) return;
    var p = placing;
    placing = null;
    act3.classList.remove('placing', 'on-body');

    p.item.used = false;
    p.item.el.classList.remove('used');       // 面板立刻恢复可点

    if (instant) { p.el.remove(); return; }

    p.el.style.transition = 'transform ' + FLY_MS + 'ms ease-out, opacity ' + FLY_MS + 'ms ease-out';
    p.el.style.transform = xf(p.item.left + STICKER_W / 2, p.item.top + STICKER_H / 2, 1);
    setTimeout(function () { p.el.remove(); }, FLY_MS + 30);
  }

  function placeSticker(p) {
    var item = placing.item;
    placing.el.remove();
    placing = null;
    act3.classList.remove('placing', 'on-body');

    var el = document.createElement('img');
    el.src = item.src;
    el.alt = '';
    el.className = 'placed';
    el.style.left = (p.x - STICKER_W / 2) + 'px';
    el.style.top = (p.y - STICKER_H / 2) + 'px';
    el.style.zIndex = String(10 + stickerCount);        // 后贴的压住先贴的

    el.style.setProperty('--rot', rot.toFixed(2) + 'deg');
    el.style.transform = 'rotate(' + rot.toFixed(2) + 'deg)';
    stickerLayer.appendChild(el);
    placed.push(el);

  function updateOkState() {

  function resetAll() {
    playSound();
    cancelPlacing(true);
    placed.forEach(function (el) { el.remove(); });
    placed = [];
    stickerCount = 0;
    palettes.forEach(function (it) { it.used = false; it.el.classList.remove('used'); });

  function flushCursor() {

  function bindStickerPlay() {

    palettes.forEach(function (item) {
      item.el.addEventListener('click', function () {

      placing.x = p.x;
      placing.y = p.y;

      rafPending = true;
      requestAnimationFrame(flushCursor);

    stage.addEventListener('click', function (e) {

  // 通用：播放某个已就绪的 <video>，返回是否成功开播（失败返回 false，由调用方走降级）
  function playVideoEl(el) {
    return new Promise(function (resolve) {
      var done = false;
      function fin(ok) { if (done) return; done = true; resolve(ok); }

      if (el.readyState >= 2) {           // 预加载已完成，直接开播
        try { el.currentTime = 0; } catch (e) {}
        try { el.play(); } catch (e) {}
        el.classList.add('in');
        return fin(true);
      }

      el.classList.add('in');
      var p = null;
      try { p = el.play(); } catch (e) { p = null; }
      if (p && typeof p.catch === 'function') p.catch(function () { fin(false); });

      el.addEventListener('playing', function onPlaying() {
        el.removeEventListener('playing', onPlaying);
        fin(true);
      });
      setTimeout(function () { fin(false); }, 3000);   // 3s 未就绪 → 降级，绝不让流程卡死
    });
  }

  /* ================= 第六幕：拼碎纸 / 修复古画（需求 §9） =================
     C1 入场 → C2 右侧 UI → C3 拼图玩法（全片首次拖拽）→ C4 完成发光 → C5 收尾

     ⚠️ 与第三幕贴纸的四处关键差异（**不要照搬第三幕的实现**）：
        · 交互：第三幕是「点击选中 → 点击落位」；本幕是「按住拖拽 → 松开判定」
          （需求 §9.10 明令：两者**不共用绑定函数**，可复用的只有 rAF 节流写法与 toStage()）
        · 落点：第三幕是**自由落点**（只看整张贴纸在不在框内）；本幕**只有一个正确位置**
        · 旋转：第三幕落定随机旋转 ±10°；本幕**绝不旋转、绝不缩放**
          （9 张是 1:1 精确同位裁剪，转了就不严丝合缝）
        · 判据：第三幕比「贴纸中心落在内缩后的框内」；本幕比「碎片中心 ↔ 目标中心的距离」

     ⚠️ C5 收尾整套复用第四幕 runAct4() 末段，但有**三处必须显式「删掉」**：
        · 不写 `#act3.ui-out` 那一步 —— Q55：本幕幕内**一律保留、不做淡出**，
          只被 70% 蒙黑整体压暗（与第四幕做法**正好相反**）
        · 不写 stopBGM() —— BGM 早在第四幕末点击 Continue 时就停了，本幕**全程静音**（Q32）
        · 不给 #act6 整幕设 pointer-events:none —— 本幕的 Continue 乃至 C3 拖拽都依赖
          真实点击，只能**逐个**给两个圆钮加 .dead（Q56）
     ⚠️ 本幕不触碰任何 bgm 代码（需求 §3.5 / Q32）。 */

  function pieceEl(id) { return puzzleEls[id] || null; }

  /* 命中判定的**纯函数**：给定「碎片中心」的画布坐标，问是否落在该碎片的目标容差内。
     与「碎片是否完整落在画框内」无关 —— 那是第三幕贴纸的口径（Q25 的 inBody()），
     本幕**不要照搬**。拆成纯函数是为了能脱离画面单测（喂坐标 → 期望命中 / 飞回）。 */
  function hitTest(id, cx, cy) {
    var m = PUZZLE_PIECES[id];
    if (!m) return false;
    var gx = m.goalX + m.w / 2, gy = m.goalY + m.h / 2;
    var dx = cx - gx, dy = cy - gy;
    return Math.sqrt(dx * dx + dy * dy) <= HIT_TOLERANCE;
  }

  // 按碎片**当前**的 left/top 判定（当前中心 = left/top + 半宽/半高）
  function judge(id) {
    var el = puzzleEls[id];
    var m = PUZZLE_PIECES[id];
    if (!el || !m) return false;
    var L = parseFloat(el.style.left) || 0, T = parseFloat(el.style.top) || 0;
    return hitTest(id, L + m.w / 2, T + m.h / 2);
  }

  // 创建一张碎片：初始挂在 #piece-layer（z 10）、摆在底板初始坐标上、opacity 0
  function createPiece(id) {
    var m = PUZZLE_PIECES[id];
    var el = document.createElement('img');
    el.src = PUZZLE_DIR + id + '.png';
    el.alt = '';
    el.className = 'piece';
    el.setAttribute('data-piece', id);
    el.style.left = m.trayX + 'px';
    el.style.top = m.trayY + 'px';
    el.style.width = m.w + 'px';      // 写死尺寸：不必等图解码，布局坐标即确定
    el.style.height = m.h + 'px';
    el.addEventListener('pointerdown', onPieceDown(id));
    pieceLayer.appendChild(el);
    puzzleEls[id] = el;
    return el;
  }

  // 分波投放：同一波 3 张**同时**出现在底板，淡入 400ms、逐张错峰 40ms（沿用第三幕贴纸节奏）
  function dropWave(i) {
    var ids = PUZZLE_WAVES[i];
    var k;
    for (k = 0; k < ids.length; k++) { if (!puzzleEls[ids[k]]) createPiece(ids[k]); }
    for (k = 0; k < ids.length; k++) {
      (function (id, kk) {
        setTimeout(function () {
          var el = puzzleEls[id];
          if (el) el.classList.add('in');
        }, 40 * kk);
      })(ids[k], k);
    }
    return anim(400 + 40 * (ids.length - 1));   // 覆盖波内最晚一张的淡入
  }

  function waveComplete(i) {
    var ids = PUZZLE_WAVES[i];
    for (var k = 0; k < ids.length; k++) { if (!lockedIds[ids[k]]) return false; }
    return true;
  }

  /* 每次落位后检查推进：
     当波 3 张全部落位 → 停顿 400ms → 投下一波；第 3 波全落位 → 9/9 完成。 */
  function advanceAfterLock() {
    if (!puzzleLive || !waveComplete(puzzleWave)) return;
    if (puzzleWave < PUZZLE_WAVES.length - 1) {
      puzzleWave++;
      var g = puzzleGen, next = puzzleWave;
      sleep(400).then(function () {
        if (g !== puzzleGen || !puzzleLive) return;   // 期间被「重来」作废
        dropWave(next);
      });
    } else {
      puzzleLive = false;
      var r = puzzleResolve;
      puzzleResolve = null;
      if (r) r();
    }
  }

  /* ① 拿起（pointerdown，绑在**碎片元素**上）：
     从底板进入拖拽层（z 60），放大 1.05 + 投影、cursor: grabbing。 */
  function onPieceDown(id) {
    return function (e) {
      if (busy || animLock || dragging || lockedIds[id] || !puzzleLive || act6Done) return;
      var el = puzzleEls[id];
      if (!el) return;
      e.preventDefault();
      var p = toStage(e);                       // ⚠️ 必须走 toStage（#stage 带 scale）
      var L = parseFloat(el.style.left) || 0, T = parseFloat(el.style.top) || 0;
      dragging = { id: id, el: el, offX: p.x - L, offY: p.y - T, x: p.x, y: p.y };
      el.style.transition = 'none';             // 跟随期间禁止过渡，否则每帧都追赶、画面拖影
      el.classList.add('lift');
      pieceDrag.appendChild(el);                // 换父节点：两层都是 0/0 铺满画布，坐标语义不变
      playSound();                              // 拿起（需求 §9.10）
      // 指针捕获挂在 #stage 上：拖出画布再松开也能收到 pointerup，
      // 否则 dragging 会永远非空、整幕再也拖不动（旧引擎不支持时静默跳过）。
      try { stage.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    };
  }

  // ② 跟随：pointermove 只记录坐标，真正改样式交给 rAF 节流
  function flushDrag() {
    dragPending = false;
    if (!dragging) return;
    var el = dragging.el;
    el.style.left = (dragging.x - dragging.offX) + 'px';
    el.style.top  = (dragging.y - dragging.offY) + 'px';
  }

  function pointerInStage(e) {
    var r = stage.getBoundingClientRect();
    return e.clientX >= r.left && e.clientX <= r.right &&
           e.clientY >= r.top  && e.clientY <= r.bottom;
  }

  /* ③ 松开（pointerup / pointercancel，绑在 **#stage** 上，不绑 document）：
     松手瞬间先按真实落点定稿位置，再进判定。 */
  function onStagePointerUp(e) {
    if (!dragging) return;
    var d = dragging;
    dragging = null;
    try { stage.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }

    var inside = pointerInStage(e);
    if (inside) {
      var p = toStage(e);
      d.x = p.x;
      d.y = p.y;
      d.el.style.left = (d.x - d.offX) + 'px';
      d.el.style.top  = (d.y - d.offY) + 'px';
    }
    // 指针移出画布再松开 → 一律视为未命中（需求 §9.5.2 第 5 条）
    if (inside && judge(d.id)) snapPiece(d.id);
    else flyBack(d.id);
  }

  // ④ 命中：吸附到该碎片的**精确目标坐标**（不是「就近对齐」）→ 锁定 → 计数 +1
  function snapPiece(id) {
    var m = PUZZLE_PIECES[id], el = puzzleEls[id];
    animLock = true;
    el.classList.remove('lift');
    // 吸附允许 left/top 过渡（跟随期间被关掉，这里临时挂上，过渡结束后清掉）
    el.style.transition = 'left ' + SNAP_MS + 'ms ease-out, top ' + SNAP_MS + 'ms ease-out, ' +
                          'transform .15s ease-out, opacity .4s ease-out';
    el.style.left = m.goalX + 'px';
    el.style.top  = m.goalY + 'px';
    pieceLayer.appendChild(el);              // 回已落位层（z 10）
    playSound();
    lockedIds[id] = true;
    puzzleCount++;
    setTimeout(function () {
      el.style.transition = '';
      animLock = false;
      advanceAfterLock();
    }, SNAP_MS);
  }

  // ⑤ 未命中：飞回底板原位 → 该碎片**仍可再拖、不计数**
  function flyBack(id) {
    var m = PUZZLE_PIECES[id], el = puzzleEls[id];
    animLock = true;
    el.classList.remove('lift');
    el.style.transition = 'left ' + FLY_BACK_MS + 'ms ease-out, top ' + FLY_BACK_MS + 'ms ease-out, ' +
                          'transform .15s ease-out, opacity .4s ease-out';
    el.style.left = m.trayX + 'px';
    el.style.top  = m.trayY + 'px';
    pieceLayer.appendChild(el);
    playSound();
    setTimeout(function () {
      el.style.transition = '';
      animLock = false;
    }, FLY_BACK_MS);
  }

  /* 重来（btn-again）：Q45 = **重置本幕** —— 清空落位碎片、回到第 1 波。
     ⚠️ 背景 / 右侧底板 / 两个圆钮 / 参考缩略图**都不重播**（C1 / C2 不重跑）——
        这正是「重置本幕」与「整局重开」的分界。 */
  function resetPuzzle() {
    if (busy || animLock || dragging) return;
    playSound();
    puzzleGen++;                             // 作废在途的「下一波」延迟
    for (var id in puzzleEls) {
      if (Object.prototype.hasOwnProperty.call(puzzleEls, id)) puzzleEls[id].remove();
    }
    puzzleEls = {};
    lockedIds = {};
    puzzleCount = 0;
    puzzleWave = 0;
    dropWave(0);                             // 重新投第 1 波
  }

  /* 看参考图（btn-picture）：Q51 = 手动那次 **3s**；重复点击**重置**计时（不是叠加）。
     ⚠️ 这一步**不能用 anim()** —— 那会让 busy 在这 3s 内为 true，
        碎片将拖不动、两个圆钮也点不动；而需求明确「期间不打断拼图」。
        所以只做 classList 切换 + setTimeout，完全不碰 busy。 */
  function showHint(ms) {
    smallPicture.classList.add('in');        // 淡入 300ms（CSS 过渡）
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(function () {
      smallPicture.classList.remove('in');   // 淡出 300ms
      hintTimer = null;
    }, ms);
  }

  function bindPuzzlePlay() {
    // 跟随光标：只记录坐标，改样式交给 rAF 节流
    stage.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var p = toStage(e);
      dragging.x = p.x;
      dragging.y = p.y;
      if (dragPending) return;
      dragPending = true;
      requestAnimationFrame(flushDrag);
    });
    // 松开 / 取消：绑在 #stage（不绑 document，避免拖出窗口后仍跟随），只在 dragging 非空时生效
    stage.addEventListener('pointerup', onStagePointerUp);
    stage.addEventListener('pointercancel', onStagePointerUp);

    btnAgain.addEventListener('click', function () {
      if (busy || animLock || dragging || act6Done) return;
      resetPuzzle();
    });
    btnPicture.addEventListener('click', function () {
      if (busy || animLock || dragging || act6Done) return;
      playSound();
      showHint(MANUAL_HINT_MS);
    });
  }

  // C1 入场：黑幕停留 500ms → .active → 黑幕淡出 400ms → 画框底罩 / 静态底同帧淡入 300ms
  function runAct6Intro() {
    return sleep(500)                        // 与全片所有转场一致；素材已在 runAct5 的 B8 起预加载
      .then(function () {
        // 激活瞬间画面仍全黑，可瞬时切换（同第三 / 四 / 五幕）
        return anim(0, function () { act6.classList.add('active'); });
      })
      .then(function () {
        // 幕间转场黑幕淡出 400ms —— runAct5 的 B8 刚把 .fast 摘掉（那里要 700ms 渐入），这里补回
        blackout.classList.add('fast');
        return anim(400, function () { blackout.classList.remove('in'); });
      })
      .then(function () {
        // 画框底罩(3) 与 静态底(4) **同一帧**交叉淡入。
        // ⚠️ bg-picture 不需要 .in —— 它是本幕「一开始就在」的常驻底（z 1），
        //    「露出木桌」完全由上面黑幕淡出完成；照抄第五幕的 bg-inside 会变成
        //    「黑幕淡完画面还是空的、再等 300ms 才出木桌」。
        return anim(300, function () {
          pictureLine.classList.add('in');
          pieceMany.classList.add('in');
        });
      });
  }

  // C2 右侧 UI：底板自右向左滑入 → 两钮自左向右滑入（错峰 100ms）→ 自动参考图 2s
  function runAct6Ui() {
    return anim(600, function () { framePicture.classList.add('in'); })
      .then(function () { return anim(500, function () { btnAgain.classList.add('in'); }); })
      .then(function () { btnAgain.classList.add('settled'); return sleep(100); })
      .then(function () { return anim(500, function () { btnPicture.classList.add('in'); }); })
      .then(function () { btnPicture.classList.add('settled'); return sleep(100); })
      .then(function () { return anim(300, function () { smallPicture.classList.add('in'); }); })
      .then(function () { return sleep(AUTO_HINT_MS); })               // 自动那次 = 2s（Q50）
      .then(function () { return anim(300, function () { smallPicture.classList.remove('in'); }); });
  }

  /* C3 拼图玩法：事件驱动，Promise 在 **9/9 落位**时 resolve。
     ⚠️ 进玩法循环前必须把 busy 置回 false —— waitClick / 各点击监听里的 busy 判定
        会把点击全吞掉，而本幕的拖拽靠 pointerdown（第三幕踩过同一个坑）。 */
  function runPuzzlePlay() {
    busy = false;
    puzzleLive = true;
    return new Promise(function (resolve) {
      puzzleResolve = resolve;               // 交给 advanceAfterLock() 在 9/9 时调用
      dropWave(0);
    });
  }

  /* C4 完成态 + C5 收尾：四拍与时长**逐项沿用第四幕**（runAct4() 末段）。
     终点 = 点击 Continue → 黑幕渐入 → 全黑滞留（Q53）。 */
  function runAct6Finish() {
    return anim(350, function () {})        // 第 9 张落位后停顿（需求 §9.6 的 300–400，取中值）
      .then(function () {
        return anim(400, function () {
          allPicture.classList.add('in');
          /* 🆕 问题2（Q58）：整幅画出现时「整体放大再缩回原尺寸」。
             ⚠️ 与 `.in` **同一帧**挂上（动画自己在 keyframes 里等足 400ms 再起跳），
                且**只加不摘** —— 摘除会重启同帧并存的 `picGlow`（相位归零 → 可见闪）。 */
          allPicture.classList.add('pop');
        });
      })
      // Q49 / Q54：发光**常驻不熄灭** —— 挂上就不再摘，进入 C5 也保持，
      // 只是随后被 #shadow6（70% 蒙黑）整体压暗
      .then(function () { return anim(0, function () { allPicture.classList.add('glow'); }); })
      .then(function () { return sleep(2000); })                       // Q54：「2s」＝进 C5 的等待

      // C5 第 1 拍：蒙黑 600ms —— **同一帧**（取淡入首帧）关掉两钮点击（Q56）。
      // ⚠️ 不等到 600ms 淡完再关：否则那个窗口里点 btn-again 会把正在收尾的幕重置，
      //    留下「蒙黑已出、拼图却被清空」的错乱态。
      .then(function () {
        // Q55：幕内一切保留、不做淡出。参考缩略图若恰在显示也让它留着（不摘 .in），
        // 因此在这里停掉它的计时器，避免它自己在收尾途中淡出。
        if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
        return anim(600, function () {
          shadow6.classList.add('in');
          btnAgain.classList.add('dead');
          btnPicture.classList.add('dead');
        });
      })
      // 第 2 拍：第二张 Goal 卡落下 380ms
      .then(function () { return anim(380, function () { goal02.classList.add('in'); }); })
      // 第 3 拍：Continue 滑入 500ms → **滑完**才可点
      .then(function () {
        return anim(500, function () { btnContinue6.classList.add('in'); }).then(function () {
          btnContinue6.classList.add('ready');
          setTimeout(function () { btnContinue6.classList.add('settled'); }, 520);
        });
      })
      .then(function () { return waitClick(btnContinue6); })

      /* 第 4 拍：点击的**同一帧**整组撤场 + 黑幕渐入（D8 第三次实例）。
         ⚠️ 只撤这三件 —— 已落位碎片 / all-picture（含光晕）/ 右侧底板 / 两个圆钮
            按 Q55 明确「保留」，不得在这里给它们加 .out 或淡出。
         三撤场 120 / 400 / 150ms **全部短于**黑幕 400ms → 黑幕到顶时幕内已无残留。 */
      .then(function () {
        return anim(400, function () {
          goal02.classList.remove('in');          // 回 CSS 初态，opacity 120ms 归零
          shadow6.classList.remove('in');
          shadow6.classList.add('out');           // 退场压至 400ms
          btnContinue6.classList.remove('in');
          btnContinue6.classList.add('out');      // 退场压至 150ms
          blackout.classList.add('in');           // 400ms 渐入
        });
      })
      // 全黑滞留 = 全片终点（Q53）：不重播、不显示额外文字 / 按钮、不回到第一幕
      .then(function () { return sleep(400); })
      .then(function () { act6Done = true; });
  }

  // 第六幕总控：串起 C1 → C5（分幕结构与第三幕同构，只是多一步）
  function runAct6() {
    act6Started = true;
    return Promise.resolve()
      .then(runAct6Intro)
      .then(runAct6Ui)
      .then(runPuzzlePlay)
      .then(runAct6Finish);
  }

  /* ================= 主流程 ================= */
  function main() {
    return Promise.resolve()

      // 0. 预加载（期间纯黑）—— 只加载第一、二幕
      .then(preload)

      // 1. 第一幕：背景淡入
      .then(function () { return anim(400, function () { bgStart.classList.add('in'); }); })
      .then(function () { window.__njMarkBooted(); })   // 第一幕已出，撤销启动看门狗

      // 2. START 按钮淡入
      .then(function () { return sleep(400); })
      .then(function () { return anim(400, function () { btnStart.classList.add('in'); }); })

      // 3. 等待点击 START
      //    这一下点击是「开始游戏」，也是全片音乐的唯一起点（需求 §3.5.1）：
      //    点击音效与 BGM 起点重合，两者都响（音效在前，BGM 紧随起播）。
      .then(function () { return waitClick(btnStart); })
      .then(function () { startBGM(); })

      // 4. 交叉转场：第一幕淡出，第二幕（房间）淡入
      .then(function () {
        return anim(400, function () {
          act1.classList.add('out');
          act2.classList.add('in');
        });
      })

      // 5. 对话弹窗自下而上滑入并贴底
      .then(function () { return anim(600, function () { chat.classList.add('in'); }); })

      // 6. 打第 1 句
      .then(function () { return typeText(LINE1, TYPE_SPEED, chatText); })

      // 7. 打完才出现 GO 按钮
      .then(function () { return anim(300, function () { btnGo.classList.add('in'); }); })

      // 8. 等待第 1 次点击 GO
      .then(function () { return waitClick(btnGo); })

      // 9. 隐藏按钮 + 清空第一句
      .then(function () {
        btnGo.classList.remove('in');
        chatText.textContent = '';
        return sleep(300);
      })

      // 10. 行李箱出现（距右 50 / 距底 30，淡入 + 上浮）
      .then(function () { return anim(450, function () { suitcase.classList.add('in'); }); })

      // 11. 打第 2 句
      .then(function () { return typeText(LINE2, TYPE_SPEED, chatText); })

      // 12. 打完才再次出现 GO 按钮
      .then(function () { return anim(300, function () { btnGo.classList.add('in'); }); })

      // 13. 等待第 2 次点击 GO
      .then(function () { return waitClick(btnGo); })

      // 14. 隐藏按钮
      .then(function () { btnGo.classList.remove('in'); return sleep(300); })

      // 15. 整个对话弹窗（chat.png 画面 + Luna 姓名牌 + 台词文本）淡出消失
      .then(function () { return anim(400, function () { chat.classList.add('out'); }); })

      // 16. 然后引导手才出现，行李箱变为可点击
      .then(function () { return anim(300, function () { hand.classList.add('in'); }); })
      .then(function () {
        suitcase.classList.add('clickable');
        return waitClick(suitcase);
      })

      // 17. 点击行李箱：隐藏引导手
      .then(function () {
        suitcase.classList.remove('clickable');
        return anim(300, function () { hand.classList.remove('in'); });
      })

      // 18. 第二幕末尾：黑幕渐入 —— 本版起它是「转场」而非终点。
      //     同时提前起跑三、四幕的预加载（不阻塞）。
      .then(function () {
        preloadAct34();
        return anim(700, function () { blackout.classList.add('in'); });
      })

      // 19. 第三幕：视频 → 定格 → 第三句 → 面板入场 → 玩法循环 → 点 OK
      .then(bindStickerPlay)
      .then(runAct3Intro)
      .then(runStickerPanelIntro)
      .then(runStickerPlay)

      // 20. 第四幕：蒙黑 → Goal → Continue → 全黑（v2.12 起此黑屏是转场，衔接第五幕）
      .then(runAct4)

      // 21. 第五幕：视频 → 户外两句 → 进室内 → 室内两句 → 引导手 → 点纸片 → 黑幕转场
      .then(runAct5)

      // 22. 第六幕：拼碎纸 / 修复古画 → C1 入场 → C2 右侧 UI → C3 拼图（9/9）
      //     → C4 发光 → C5 蒙黑 + Goal 2 + Continue → 全黑滞留（**全片终**）
      .then(bindPuzzlePlay)
      .then(runAct6)

      .catch(function (err) {
        reportFailure('运行出错', (err && (err.stack || err.message)) || String(err));
      });
  }

  /* ================= 测试钩子（不影响正常表现） ================= */
  window.__nj = {
    setRotation: function (deg) { rotOverride = deg; },
    clearRotation: function () { rotOverride = null; },
    dropBox: function () { return DROP_BOX; },      // 「可显示范围」红框（画布坐标）
    dropCenter: function () { return DROP; },       // 由红框内缩得到的贴纸中心可落点区间
    body: function () { return DROP_BOX; },         // 旧名，语义等同 dropBox
    // 第六幕拼图几何的唯一来源（与 index.html 内的 PUZZLE_* 同源，不在测试里重抄一遍）
    puzzle: function () {
      var center = {};
      for (var id in PUZZLE_PIECES) {
        if (Object.prototype.hasOwnProperty.call(PUZZLE_PIECES, id)) {
          var m = PUZZLE_PIECES[id];
          center[id] = { x: m.goalX + m.w / 2, y: m.goalY + m.h / 2 };
        }
      }
      return {
        dir: PUZZLE_DIR,
        waves: PUZZLE_WAVES,
        pieces: PUZZLE_PIECES,
        goalCenter: center,
        tolerance: HIT_TOLERANCE,
        snapMs: SNAP_MS,
        flyBackMs: FLY_BACK_MS,
        autoHintMs: AUTO_HINT_MS,
        manualHintMs: MANUAL_HINT_MS,
        resetScope: RESET_SCOPE
      };
    },
    // 纯判定：喂「碎片中心」坐标 → 是否命中（不碰画面，供 a6b 的判定矩阵单测）
    judgeAt: function (id, cx, cy) { return hitTest(id, cx, cy); },
    state: function () {
      return {
        count: stickerCount, okReady: okReady, placing: !!placing, act3Done: act3Done,
        busy: busy, animLock: animLock,
        booted: booted,                     // 第一幕是否已渲染（看门狗标记）
        fallbackShown: !!(fallbackBox && !fallbackBox.hidden),  // 是否显示了启动失败提示
        // 第五幕状态（需求 §8）—— 供测试断言，只读
        act5: {
          started: act5Done,                     // 第五幕是否已进入
          outdoorIn: outdoor5.classList.contains('in'),   // 户外定格图是否显示中
          videoReady: video5.readyState >= 2,
          videoEnded: video5.ended,
          chat5aIn: chat5a.classList.contains('in'),
          chat5bIn: chat5b.classList.contains('in'),
          papersIn: btnPapers.classList.contains('in'),
          papersClickable: btnPapers.classList.contains('clickable'),
          hand5In: hand5.classList.contains('in'),
          bgInsideIn: bgInside.classList.contains('in')
        },
        // 第六幕状态（需求 §9）—— 供测试断言，只读
        act6: {
          started: act6Started,
          active: act6.classList.contains('active'),
          count: puzzleCount,                    // 已落位碎片数 0 → 9
          wave: puzzleWave,                      // 当前波次
          dragging: !!dragging,                  // 是否正在拖拽
          locked: (function () { var n = 0, k; for (k in lockedIds) { if (Object.prototype.hasOwnProperty.call(lockedIds, k)) n++; } return n; })(),
          puzzleLive: puzzleLive,
          bgPictureSrc: bgPicture.getAttribute('src'),
          pictureLineIn: pictureLine.classList.contains('in'),
          pieceManyIn: pieceMany.classList.contains('in'),
          framePictureIn: framePicture.classList.contains('in'),
          btnAgainIn: btnAgain.classList.contains('in'),
          btnAgainDead: btnAgain.classList.contains('dead'),
          btnPictureIn: btnPicture.classList.contains('in'),
          btnPictureDead: btnPicture.classList.contains('dead'),
          smallPictureIn: smallPicture.classList.contains('in'),
          allPictureIn: allPicture.classList.contains('in'),
          allPictureGlow: allPicture.classList.contains('glow'),   // Q54：应为「挂上后不摘除」
          shadow6In: shadow6.classList.contains('in'),
          shadow6Out: shadow6.classList.contains('out'),
          goal02In: goal02.classList.contains('in'),
          continue6In: btnContinue6.classList.contains('in'),
          continue6Ready: btnContinue6.classList.contains('ready'),
          uiOut: act6.classList.contains('ui-out'),               // Q55：本幕**必须**恒为 false
          done: act6Done
        },
        // BGM 状态（需求 §3.5 / Q27–Q30）—— 供测试断言，只读
        bgm: {
          ready: bgmReady,                  // 是否已完成加载（canplaythrough）
          wanted: bgmWanted,                // 玩家已点 START、应当正在响
          paused: bgm.paused,               // 是否暂停
          loop: bgm.loop,                   // Q28：应为 true
          volume: bgm.volume,               // Q27：应为 0.35
          currentTime: bgm.currentTime,     // Q29：跨幕不重启，此值应单调不减
          src: bgm.src
        },
        soundVolume: pool.length ? pool[0].volume : 0   // 点击音效音量（应为 0.85，不受 BGM 影响）
      };
    }
  };

  /* ================= 启动 ================= */
  try {
    fitStage();
    main();
  } catch (err) {
    reportFailure('初始化失败', (err && (err.stack || err.message)) || String(err));
  }

})();
</script>
