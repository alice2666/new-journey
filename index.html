<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>New Journey</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden; background: #000;
  }

  /* ---------- 视口：负责居中与等比缩放 ---------- */
  #viewport {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }

  /* ---------- 舞台：内部坐标严格 1200 x 896 ---------- */
  #stage {
    width: 1200px; height: 896px;
    flex: 0 0 auto;                    /* 关键：禁止被 flex 容器压缩，否则内部坐标系会被挤成窗口尺寸 */
    position: relative; overflow: hidden;
    background: #000;
    transform-origin: center center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    user-select: none; -webkit-user-select: none;
    cursor: default;
  }

  #stage img { display: block; -webkit-user-drag: none; }

  /* ---------- 场景层 ---------- */
  .scene { position: absolute; inset: 0; }
  /* 每一幕必须是「自包含的堆叠上下文」，否则幕内元素的 z-index 会跑到 #stage 层
     与其他幕的高层元素抢层级 —— 例如 #act4 的 #goal01(z=95) 会盖住 #act5(z=5)。
     成因：#act4 在 .active 时 opacity:1，就不再创建堆叠上下文了（opacity<1 才创建）。
     isolation:isolate 强制创建堆叠上下文，让幕内 z-index 全部被限制在本幕内。
     支持度：Chrome 41+ / Edge 15+ / Firefox 36+，与本页最低要求一致。 */
  .scene { isolation: isolate; }

  #act1 { opacity: 1; transition: opacity .4s ease-out; }
  #act1.out { opacity: 0; pointer-events: none; }

  /* act2 是覆盖在 act1 之上的全屏层：未激活时必须让点击穿透，
     否则 opacity:0 也会拦截点击，导致第一幕的 START 按钮点不动 */
  #act2 { opacity: 0; z-index: 2; transition: opacity .4s ease-out; pointer-events: none; }
  #act2.in { opacity: 1; pointer-events: auto; }

  /* ---------- 背景 ---------- */
  #bg-start, #bg-room {
    position: absolute; left: 0; top: 0;
    width: 1200px; height: 896px;
  }

  /* ---------- 淡入元素默认态 ---------- */
  #bg-start, #btn-start, #suitcase, #hand, #btn-go, #btn-go3, #blackout { opacity: 0; }
  #bg-start.in, #btn-start.in, #suitcase.in, #hand.in,
  #btn-go.in, #btn-go3.in, #blackout.in { opacity: 1; }

  /* ---------- 第一幕 START：水平居中，底边距画布底 170px ---------- */
  #btn-start {
    position: absolute;
    left: 486.5px; bottom: 170px;      /* 227x97 -> 中心 x = 600 */
    width: 227px; height: 97px;
    transform-origin: center center;
    transition: opacity .4s ease-out, transform .15s ease-out;
    pointer-events: none;
  }
  #btn-start.in { pointer-events: auto; cursor: pointer; }
  #btn-start.in:hover { transform: scale(1.05); }
  #btn-start.in:active { transform: scale(.95); }

  /* ---------- 对话弹窗：自下而上滑入并贴底 ----------
     抽成 .chat 公共类：第二幕 #chat 与第三幕 #chat3 共用同一套几何与动画
     （screen3/chat.png 与 screen2/chat.png md5 相同，无需重新定位）。
     id 保留不变，供既有断言与 JS 引用。 */
  .chat {
    position: absolute; left: 0; top: 400px;
    width: 1200px; height: 496px;
    z-index: 30;
    transform: translateY(110%);
    transition: transform .6s ease-out, opacity .35s ease-out;
    pointer-events: none;              /* 纯装饰，不拦截点击 */
  }
  .chat.in { transform: translateY(0); }
  /* 点击 GO 后：整个 chat.png（画面 + Luna 姓名牌 + 台词）整体淡出消失 */
  .chat.out { opacity: 0; }

  .chat-frame {
    position: absolute; left: 0; top: 0;
    width: 1200px; height: 496px;
    pointer-events: none;
  }

  /* 台词文本区。#chat 位于画布 top:400 且与画面底边贴齐（400 + 496 = 896），
     本元素的坐标是「弹窗内局部坐标」，换算成画布坐标：
       left 380px  -> 画布 x = 380（chat 的 left 为 0）
       top  370.4px -> 画布 y = 400 + 370.4 = 770.4（2 行时底边落在画布 y=846，
                       即底边距画面底 896-846 = 50px；原为 70，按需求整体下移 20px）
       width 640px -> 右边缘 = 画布 x 1020，距画面右 180px（让开 GO 按钮 x1062）
     ── 为什么用 top 锚定，而不是 bottom ──────────────────────────────
     「Luna」姓名牌占画布 y690-755 / x351-523，横向正压在文字左边界上方，
     所以文字「墨迹顶边」必须 >= 755 才不算压倒它。
     若用 bottom 锚定，行数一多文字就往上长：bottom=50 时 3 行墨迹顶边到 739，
     压住姓名牌 16px；bottom 再往下压到 28 才能让 3 行安全，但 2 行就明显偏下了。
     改成 top 锚定后，行数增加只向下生长 —— 2 行与 3 行的墨迹顶边恒为画布 y≈776.4
     （即原 756.4 下移 20px），既满足「2-3 行整体下移 20px」，
     又让 2/3 行都永不压牌、始终落在浅蓝底板上。
     ── 实测参照（均为画布坐标）────────────────────────────────────
     浅蓝底板上沿 y=718；姓名牌 x351-523 / y690-755；角色立绘最右 x=350；
     GO 按钮 x1062-1100 / y799-846。 */
  #chat-text, .chat-text {
    position: absolute;
    left: 380px;
    width: 640px;
    top: 370.4px;
    margin: 0;
    font-size: 28px; line-height: 1.35;
    font-weight: 600; letter-spacing: .2px;
    color: #123a72;
  }

  /* ---------- 行李箱：距右 50px，距底 30px ---------- */
  #suitcase {
    position: absolute;
    right: 50px; bottom: 30px;         /* 225x414 -> left 925, top 452 */
    width: 225px; height: 414px;
    z-index: 10;
    transform: translateY(20px);
    transition: opacity .45s ease-out, transform .45s ease-out;
    pointer-events: none;
  }
  #suitcase.in { transform: translateY(0); }
  #suitcase.clickable { pointer-events: auto; cursor: pointer; }
  #suitcase.clickable:hover {
    filter: brightness(1.06) drop-shadow(0 0 12px rgba(255,255,255,.65));
  }

  /* ---------- 引导手：指尖(7% 0%)为缩放原点，循环点按 ---------- */
  #hand {
    position: absolute;
    left: 989px; top: 548px;           /* 165x161 -> 指尖落在行李箱拉杆上 */
    width: 165px; height: 161px;
    z-index: 20;
    transform-origin: 7% 0%;
    pointer-events: none;
    transition: opacity .3s ease-out;
    animation: tap .9s ease-in-out infinite;
  }
  @keyframes tap {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(.85); }
  }

  /* ---------- 推进按钮：距右 100px，距底 50px（第二幕 #btn-go / 第三幕 #btn-go3 共用） ---------- */
  #btn-go, #btn-go3 {
    position: absolute;
    right: 100px; bottom: 50px;        /* 38x47 -> left 1062, top 799 */
    width: 38px; height: 47px;
    z-index: 40;
    transform-origin: center center;
    transition: opacity .3s ease-out, transform .15s ease-out;
    pointer-events: none;
  }
  #btn-go.in, #btn-go3.in { pointer-events: auto; cursor: pointer; }
  #btn-go.in:hover, #btn-go3.in:hover { transform: scale(1.15); }
  #btn-go.in:active, #btn-go3.in:active { transform: scale(.92); }

  /* ---------- 遮黑层 ---------- */
  #blackout {
    position: absolute; inset: 0;
    background: #000; z-index: 100;
    pointer-events: none;
    transition: opacity .7s ease-out;
  }
  #blackout.in { pointer-events: auto; }
  /* 幕间转场用 400ms 淡出（需求 §6.2） */
  #blackout.fast { transition-duration: .4s; }
  /* 透明但仍拦截点击：视频播放期间用它挡掉一切误触（需求 §8「视频播放期间完全屏蔽点击」）。
     必须放在 .in 之后：两者同特异性，靠声明顺序取胜。 */
  #blackout.guard { opacity: 0; pointer-events: auto; }

  /* ---------- 后续幕预留容器（保持为空） ----------
     #act6 已由预留位升为第五幕之后的实际容器（见下方「第六幕」段），
     这里只留 #act6-slot（第五幕以前的旧 #act5-slot）与新的 #act7-slot。 */
  #act3-slot, #act6-slot, #act7-slot { position: absolute; inset: 0; z-index: 110; pointer-events: none; }

  /* ==================================================================
     第三幕：贴纸定制（z-index 3，位于 #act2(2) 之上、#blackout(100) 之下）
     ================================================================== */
  /* 未激活时整幕必须不可见。
     注意：#bg-room-suitcase 是「常驻可见」的定格图（不像 #act3-video 那样自带 opacity:0），
     而 #act3 的 z-index(3) 高于 #act2(2) 与 #act1(auto)。若只写 z-index 不写 opacity，
     这张定格图会从页面载入的第一帧起就盖在第一、二幕之上 ——
     表现为「一打开就是行李箱的房间、看不到开始界面、画面怎么都不动」。
     激活那一刻 #blackout 仍是全黑，所以这里不加过渡、瞬时切换更安全。 */
  #act3 { opacity: 0; z-index: 3; pointer-events: none; }
  #act3.active { opacity: 1; pointer-events: auto; }
  /* 待放置贴纸时的光标反馈：箱身内 pointer，范围外 not-allowed */
  #act3.placing { cursor: not-allowed; }
  #act3.placing.on-body { cursor: pointer; }

  #bg-room-suitcase, #act3-video {
    position: absolute; left: 0; top: 0; width: 1200px; height: 896px;
  }
  /* 定格图常驻视频下层：视频结束时视频淡出即可露出它，末帧有细微差异也不会闪黑 */
  #bg-room-suitcase { z-index: 1; }
  #act3-video {
    z-index: 2;
    object-fit: fill;                  /* 1112x834 -> 1200x896，纵横比仅差 0.45% */
    opacity: 0;
    transition: opacity .25s ease-out;
  }
  #act3-video.in { opacity: 1; }

  /* 已落定的贴纸容器（箱身贴纸 z-index 10 起，按贴上顺序递增） */
  #sticker-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  #sticker-layer .placed {
    position: absolute; width: 142px; height: 119px;
    transform-origin: center center;
    animation: drop .18s ease-out;
  }
  @keyframes drop {
    from { transform: rotate(var(--rot, 0deg)) scale(1.12); }
    to   { transform: rotate(var(--rot, 0deg)) scale(1); }
  }

  /* 贴纸面板：距顶 45 / 距右 25 -> left 653 / top 45 */
  #sticker-panel { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
  #sticker-frame {
    position: absolute; left: 653px; top: 45px; width: 522px; height: 630px;
    transform: translateX(560px);      /* 初始完全在画布右侧之外：653+560 = 1213 > 1200 */
    transition: transform .6s ease-out;
  }
  #sticker-frame.in { transform: translateX(0); }

  /* 调色板 12 张贴纸：142x119，与面板槽位等尺寸，直接对位（坐标写在 HTML 内联样式） */
  .palette {
    position: absolute; width: 142px; height: 119px;
    opacity: 0;
    transition: opacity .4s ease-out, filter .2s ease-out;
    pointer-events: none;
  }
  .palette.in { opacity: 1; pointer-events: auto; cursor: pointer; }
  .palette.in:hover { filter: brightness(1.08) drop-shadow(0 0 10px rgba(255,255,255,.55)); }
  /* 已使用 / 待放置：置灰且不可再点（同一张贴纸不允许重复使用 —— Q15） */
  .palette.used { opacity: .35; filter: grayscale(1); pointer-events: none; cursor: default; }

  /* 手持 / 飞行层：待放置贴纸跟随光标 + 飞回取消的过渡元素 */
  #sticker-cursor { position: absolute; inset: 0; z-index: 45; pointer-events: none; }
  #sticker-cursor img {
    position: absolute; left: 0; top: 0;
    width: 142px; height: 119px;
    opacity: .85;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,.35));
    will-change: transform;
    pointer-events: none;
  }

  /* RESET / OK：距底 85 -> top 714；OK 距右 25 -> left 949，RESET 在 OK 左 70px -> left 652 */
  #btn-reset, #btn-ok {
    position: absolute; top: 714px; z-index: 40;
    transform: translateY(150px);      /* 初始完全在画布下沿之外：714+150 = 864，下边缘 961 > 896 */
    opacity: 0; pointer-events: none;
    transition: transform .5s ease-out, opacity .3s ease-out, filter .2s ease-out;
  }
  #btn-reset { left: 652px; width: 227px; height: 97px; }
  #btn-ok    { left: 949px; width: 226px; height: 97px; }
  #btn-reset.in, #btn-ok.in { transform: translateY(0); }
  #btn-reset.in { opacity: 1; pointer-events: auto; cursor: pointer; }
  #btn-reset.in:hover  { transform: translateY(0) scale(1.05); }
  #btn-reset.in:active { transform: translateY(0) scale(.95); }
  /* OK 出现后默认置灰禁用（贴纸数 < 3），≥ 3 才由 JS 切到 .ready */
  #btn-ok.in.dim   { opacity: .45; filter: grayscale(1); pointer-events: none; cursor: not-allowed; }
  #btn-ok.in.ready { opacity: 1; filter: none; pointer-events: auto; cursor: pointer; }
  #btn-ok.in.ready:hover  { transform: translateY(0) scale(1.05); }
  #btn-ok.in.ready:active { transform: translateY(0) scale(.95); }
  /* 入场动画跑完后切成快速过渡，hover 才不迟钝 */
  #btn-reset.in.settled, #btn-ok.in.settled { transition: transform .15s ease-out, opacity .2s ease-out, filter .2s ease-out; }

  /* 点击 OK 后第三幕 UI 整体淡出（shadow.png 是 70% 半透明，不淡出会透过蒙黑层若隐若现）。
     需求只要求「面板 + 调色板 + RESET/OK 按钮」淡出 —— 箱身上已落定的贴纸属于玩家的作品，
     刻意保留，让达成页里的行李箱仍是「装饰好的那一只」。 */
  #act3.ui-out #sticker-panel { opacity: 0; transition: opacity .3s ease-out; }
  #act3.ui-out #btn-reset,
  #act3.ui-out #btn-ok { opacity: 0; pointer-events: none; }

  /* ==================================================================
     第四幕：目标达成（z-index 4）
     ================================================================== */
  /* 与 #act3 同理：整幕默认不可见，激活时由脚本加 .active。
     目前 #act4 的子元素各自都有 opacity:0 门控，所以「漏门控」暂时看不出问题，
     但只要以后往这里加一个常驻可见的元素，就会立刻盖住全屏 —— 统一门控更安全。
     不放 pointer-events：点击仍由 #continue.in.ready 单独开启。 */
  #act4 { opacity: 0; z-index: 4; pointer-events: none; }
  #act4.active { opacity: 1; }
  #shadow {
    position: absolute; inset: 0; z-index: 90;
    opacity: 0; transition: opacity .6s ease-out;
  }
  #shadow.in { opacity: 1; }
  /* goal01：水平居中 / 距顶 120 -> left 221 / top 120
     出现方式（用户指定）：**从上到下快速落下**。
     初始整张卡片在画布上方之外（下边缘 699 - 720 = -21 < 0），
     再沿 Y 轴加速落到位，落点即 top 120。ease-in 的加速段模拟自由落体，
     手感是「落」不是「滑」；opacity 只用 120ms 快速点亮，
     保证卡片一进入画布就已经可见，而不是落到位才浮现。 */
  #goal01 {
    position: absolute; left: 221px; top: 120px; width: 758px; height: 579px; z-index: 95;
    opacity: 0;
    transform: translateY(-720px);
    transition: transform .38s cubic-bezier(.55, 0, .85, .35), opacity .12s ease-out;
  }
  #goal01.in { opacity: 1; transform: translateY(0); }
  /* Continue：水平居中 / 距底 95 -> left 467.5 / top 770 */
  #continue {
    position: absolute; left: 467.5px; top: 770px; width: 265px; height: 31px; z-index: 96;
    opacity: 0;
    transform: translateY(120px);      /* 初始完全在画布下沿之外：770+120 = 890，下边缘 921 > 896 */
    transition: transform .5s ease-out, opacity .3s ease-out;
    pointer-events: none;
  }
  #continue.in { opacity: 1; transform: translateY(0); }
  /* 第四幕唯一可点击元素（Q20：点击后才转全黑，不自动延时） */
  #continue.in.ready { pointer-events: auto; cursor: pointer; }
  #continue.in.ready:hover  { transform: translateY(0) scale(1.05); }
  #continue.in.ready:active { transform: translateY(0) scale(.95); }
  #continue.in.settled { transition: transform .15s ease-out, opacity .2s ease-out; }

  /* ==================================================================
     第五幕：古城堡（z-index 5，位于 #act4(4) 之上、#blackout(100) 之下）
     ==================================================================
     ⚠️ 门控是本版最高风险点（开发计划 §9.2 R19 / 需求 §9.1.1，D4 的翻版）：
     #bg-inside.png 是「常驻可见」的全屏定格图（1200x896，无透明通道），
     不像 #act5-video 那样自带 opacity:0。而 #act5 的 z-index(5) 高于前四幕，
     一旦容器漏写 opacity:0，这张图会从页面载入的第一帧起盖住所有画面。
     所以：容器默认 opacity:0 + .active 转可见；激活那一刻 #blackout 仍全黑，
     瞬时切换即可，不加过渡更安全（与 #act3 / #act4 同做法）。 */
  #act5 { opacity: 0; z-index: 5; pointer-events: none; }
  #act5.active { opacity: 1; pointer-events: auto; }

  /* 户外定格图（= 视频末帧）：本幕的户外背景层。
     注：video 元素仍保留在 DOM 中并注入 src（供「素材体检」与旧断言识别），
     但它带 .hidden 属性恒不参与渲染，户外视觉一律由这张定格图承担。 */
  #act5-video { display: none; }

  #act5-outdoor {
    position: absolute; left: 0; top: 0; width: 1200px; height: 896px;
    z-index: 1;
    opacity: 0;
    transition: opacity .4s ease-out;
  }
  #act5-outdoor.in { opacity: 1; }

  #bg-inside {
    position: absolute; left: 0; top: 0; width: 1200px; height: 896px;
    z-index: 2;
    opacity: 0;
    transition: opacity .4s ease-out;
  }
  #bg-inside.in { opacity: 1; }

  /* 第五幕两段对话弹窗：几何完全复用第二幕 .chat（同一份 screen2/chat.png） */
  #chat5a, #chat5b { z-index: 30; }
  /* 两段对话的 GO 按钮（跨幕复用 screen2/btn-go.png，共 4 处点击） */
  #btn-go5a, #btn-go5b {
    position: absolute;
    right: 100px; bottom: 50px;        /* 38x47 -> left 1062, top 799 */
    width: 38px; height: 47px;
    z-index: 40;
    transform-origin: center center;
    opacity: 0;
    transition: opacity .3s ease-out, transform .15s ease-out;
    pointer-events: none;
  }
  #btn-go5a.in, #btn-go5b.in { opacity: 1; pointer-events: auto; cursor: pointer; }
  #btn-go5a.in:hover, #btn-go5b.in:hover { transform: scale(1.15); }
  #btn-go5a.in:active, #btn-go5b.in:active { transform: scale(.92); }

  /* 地上的纸片：距右 290 / 距底 120（Q36 已定案，按图片外接框 195x123 计）
     原始值 left 715 / top 653；本轮按用户要求整体上移 60px、左移 10px：
       left = 715 - 10  = 705（距右 300，距底 180）
       top  = 653 - 60  = 593
     B4 出现时淡入但不可点（对话正在进行）；B7 引导手出现后才变可点。 */
  #btn-papers {
    position: absolute; left: 705px; top: 593px; width: 195px; height: 123px;
    z-index: 40;
    opacity: 0;
    transition: opacity .4s ease-out, transform .15s ease-out, filter .2s ease-out;
    pointer-events: none;
  }
  #btn-papers.in { opacity: 1; }
  /* 只有进入 B7 才放开点击（否则对话期间点击纸片会打断流程） */
  #btn-papers.in.clickable { pointer-events: auto; cursor: pointer; }
  #btn-papers.in.clickable:hover { transform: scale(1.05); }
  #btn-papers.in.clickable:active { transform: scale(.96); }

  /* 第五幕引导手：复用 screen2/hand.png，指尖(transform-origin 7% 0%)指向纸片。
     实测 hand.png 的指尖像素 = (11, 0)，即 7% × 165 ≈ 11.55，与 transform-origin 一致。

<script>

     也就是说：脚本没跑起来 = 全黑 + 点不动 + 且没有任何提示 —— 这是最难自行排查的状态。
     所以第一件事是自检，把病因直接写到屏幕上，而不是让用户对着黑屏猜。 */
  var fallbackBox = document.getElementById('fallback');

  function reportFailure(title, detail, missing) {
    try { console.error('[new-journey] ' + title + (detail ? ' :: ' + detail : '')); } catch (e) { /* 忽略 */ }
    if (!fallbackBox) return;
    function put(id, val) {
      var el = document.getElementById(id);
      if (el && val !== undefined && val !== null) el.textContent = String(val);
    }
    put('fb-title', title);
    put('fb-detail', detail || '');
    put('fb-missing', missing || '—');
    try {
      put('fb-ua', navigator.userAgent);
      put('fb-proto', location.protocol === 'file:' ? 'file:// （双击打开本地文件）' : location.protocol);
      put('fb-size', window.innerWidth + ' × ' + window.innerHeight);
      put('fb-scale', window.devicePixelRatio);
    } catch (e) { /* 忽略 */ }
    fallbackBox.hidden = false;
  }

  // 引擎能力自检：这 4 项任一缺失，后面的动画必然跑不起来（比如 IE11 就缺 Promise / closest）
  var lack = [];
  if (typeof Promise !== 'function') lack.push('Promise');
  if (!document.documentElement.classList) lack.push('classList');
  if (typeof window.requestAnimationFrame !== 'function') lack.push('requestAnimationFrame');
  if (typeof Element === 'undefined' || !Element.prototype.closest) lack.push('Element.closest');

  if (lack.length) {
    reportFailure(
      '浏览器版本过旧',
      '当前浏览器缺少：' + lack.join('、') + '。\n本页需要 Chrome 41+ / Edge 15+ / Firefox 44+，请改用最新版的 Chrome 或 Edge 打开。',
      lack.join('、')
    );
    return;   // 到此为止，不继续执行后面的动画逻辑
  }

  /* ================= 启动看门狗 + 素材体检 =================

     ② 素材体检：还有一种更隐蔽的失败 —— 脚本跑得好好的、.in 类名也加了，

  var booted = false;

      if (el && el.tagName === 'IMG' && el.complete && !el.naturalWidth) {
        bad.push(el.getAttribute('src') || ids[i]);
      }
    }
    return bad;
  }

  setTimeout(function () {
    var bad = brokenAssets();
    if (bad.length) {
      reportFailure(
        '素材未能加载',
        '第一幕的图片没能显示（共 ' + bad.length + ' 个）：\n  ' + bad.join('\n  ') +

        '启动超时',

  var btnPapers   = document.getElementById('btn-papers');
  var hand5       = document.getElementById('hand5');
  var chat5a      = document.getElementById('chat5a');
  var chat5aText  = chat5a.querySelector('.chat-text');
  var btnGo5a     = document.getElementById('btn-go5a');
  var chat5b      = document.getElementById('chat5b');
  var chat5bText  = chat5b.querySelector('.chat-text');
  var btnGo5b     = document.getElementById('btn-go5b');

  var blackout   = document.getElementById('blackout');

  /* 调色板 12 张贴纸：槽位坐标的唯一来源是 HTML 的内联样式，避免两处各写一份 */
  var palettes = [].map.call(document.querySelectorAll('#sticker-panel .palette'), function (el) {
    return {
      el: el,
      key: el.getAttribute('data-sticker'),
      src: el.getAttribute('src'),
      left: parseFloat(el.style.left),
      top: parseFloat(el.style.top),
      used: false
    };
  });

  /* ================= 运行时状态 ================= */
  var busy = false;          // 演出锁：动画 / 打字期间为 true，屏蔽一切点击
  var lastClickAt = 0;       // 点击冷却
  var typeToken = 0;         // 打字任务令牌，防止串台
  var animLock = false;      // 贴纸过渡锁：落定 / 飞回期间为 true（只锁贴纸交互，不影响 RESET / OK）
  var placing = null;        // 待放置贴纸 { item, el, x, y }
  var placed = [];           // 已落定贴纸的 DOM
  var stickerCount = 0;
  var okReady = false;
  var act3Done = false;      // 第四幕是否已开始，防重复触发
  var lastPointer = null;    // 最近一次光标的画布坐标
  var rafPending = false;
  var preload34 = null;
  var preload5 = null;
  var act5Done = false;      // 第五幕是否已开始，防重复触发
  var rotOverride = null;    // 测试钩子：固定落定旋转角

  /* ================= 工具 ================= */
  function sleep(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  // 动画阶段：上锁 -> 执行 -> 到时解锁
  function anim(ms, fn) {
    busy = true;
    if (fn) fn();
    return sleep(ms).then(function () { busy = false; });
  }

  function once(el, ev) {
    return new Promise(function (r) {
      el.addEventListener(ev, function h() { el.removeEventListener(ev, h); r(); });
    });
  }

  // 等待有效点击（含音效、防连点）
  function waitClick(el) {
    return new Promise(function (resolve) {
      function handler() {
        if (busy) return;
        var now = Date.now();
        if (now - lastClickAt < CLICK_COOLDOWN) return;
        lastClickAt = now;
        el.removeEventListener('click', handler);
        playSound();
        resolve();
      }
      el.addEventListener('click', handler);
    });
  }

  /* ================= 等比缩放适配窗口 ================= */
  function fitStage() {
    // 上限 1：窗口大于 1200x896 时按 1:1 显示，绝不放大
    var s = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H, 1);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fitStage);

  /* ================= 坐标换算（自由落点的命门） =================
     #stage 带 transform: scale(s)，鼠标的 clientX/Y 是视口坐标，不能直接当画布坐标用。
     跟随定位与落点判定必须走同一套换算后的坐标，否则会出现「看着能贴、实际贴不上」。 */
  function toStage(e) {
    var r = stage.getBoundingClientRect();
    var s = r.width / STAGE_W;            // 缩放比直接从 rect 反推，不依赖外部状态
    return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s };
  }

  /* 落点判定（Q25）：入参是「贴纸中心」的画布坐标。
     必须整张贴纸（142×119 未旋转外框）完整落在 DROP_BOX 内才算有效 —— 所以这里比的是
     内缩后的 DROP 区间。改判据时务必同时改跟随高亮（.on-body）与验收断言，三者同源。 */
  function inBody(x, y) {
    return x >= DROP.left && x <= DROP.right && y >= DROP.top && y <= DROP.bottom;
  }

  /* ================= 音效（3 实例轮询，允许重叠） ================= */
  var pool = [];
  var poolIdx = 0;
  (function buildPool() {
    for (var i = 0; i < 3; i++) {
      var a = new Audio(AUDIO_SRC);
      a.preload = 'auto';
      a.volume = 0.85;
      pool.push(a);
    }
  })();

  function playSound() {
    var a = pool[poolIdx];
    poolIdx = (poolIdx + 1) % pool.length;
    try { a.currentTime = 0; } catch (e) { /* 未就绪时忽略 */ }
    var p = a.play();
    if (p && typeof p.catch === 'function') p.catch(function () {});
  }

  /* ================= 背景音乐 BGM（需求 §3.5 / Q27–Q30） =================
     全片只有 1 个实例，生命周期由两次点击夹住：
       · 起播 = 点击第一幕 START（之前全程静音）
       · 停止 = 点击第四幕 Continue（唯一停止点）
     幕间切换绝不触碰它 —— 不 pause、不回零、不改音量（Q29：跨幕完全连续）。
     加载独立于 preload() 队列，失败/超时绝不阻塞开场（Q30）。
     起播点本身是真实用户手势，自动播放策略天然满足，无需任何兜底。 */
  var bgm = new Audio(BGM_SRC);
  bgm.preload = 'auto';     // 独立拉取：5.05MB 未压缩 WAV 不进开场等待队列
  bgm.loop = true;          // Q28
  bgm.volume = 0.35;        // Q27（点击音效维持 0.85 不变）

  var bgmReady = false;     // 是否可播（canplaythrough 已触发）
  var bgmWanted = false;    // 玩家已点 START，但音乐可能尚未就绪

  // 就绪：起播点已到则立刻补播（应对「点 START 时还没下载完」）。
  // 同时监听 canplaythrough 与 loadeddata —— 少数浏览器对 preload=auto 只给后者，
  // 只等 canplaythrough 会让「补播」永不发生（点了 START 却一直没声）。
  function onBgmReady() {
    if (bgmReady) return;
    bgmReady = true;
    if (bgmWanted) startBGM();
  }
  bgm.addEventListener('canplaythrough', onBgmReady, { once: true });
  bgm.addEventListener('loadeddata', onBgmReady, { once: true });
  bgm.addEventListener('error', function () { /* 静默吞掉：绝不阻塞开场、不产生未捕获错误 */ });
  try { bgm.load(); } catch (e) { /* ignore */ }

  function startBGM() {
    bgmWanted = true;
    if (!bgmReady) return;                       // 未就绪 -> 交给 canplaythrough 回调补播
    var p = bgm.play();
    if (p && typeof p.catch === 'function') p.catch(function () {});
  }

  function stopBGM() {
    bgmWanted = false;
    try { bgm.pause(); bgm.currentTime = 0; } catch (e) { /* ignore */ }
  }

  /* ================= 预加载 ================= */
  function loadImage(src) {
    return new Promise(function (res) {
      var img = new Image();
      img.onload = function () { res(); };
      img.onerror = function () { res(); };
      img.src = src;
    });
  }

  function loadAudio() {
    return new Promise(function (res) {
      var done = false;
      function fin() { if (!done) { done = true; res(); } }
      var a = new Audio(AUDIO_SRC);
      a.preload = 'auto';
      a.addEventListener('canplaythrough', fin, { once: true });
      a.addEventListener('loadeddata', fin, { once: true });
      a.addEventListener('error', fin, { once: true });
      try { a.load(); } catch (e) { fin(); }
      setTimeout(fin, 2500);   // 兜底，绝不卡住开场
    });
  }

  function preload() {
    return Promise.all([Promise.all(IMAGES.map(loadImage)), loadAudio()]);
  }

  // 视频的 src 到此刻才注入：首屏不会去拉这 4.54MB
  function loadVideo() {
    return loadVideoEl(video, VIDEO_SRC, 4000);
  }

  // 通用：给某个 <video> 注入 src 并等到可播（或超时/出错，绝不卡住流程）
  function loadVideoEl(el, src, timeoutMs) {
    return new Promise(function (res) {
      var done = false;
      function fin() { if (done) return; done = true; res(); }
      if (!el.getAttribute('src')) el.src = src;
      el.preload = 'auto';
      el.addEventListener('canplaythrough', fin, { once: true });
      el.addEventListener('loadeddata', fin, { once: true });
      el.addEventListener('error', fin, { once: true });
      try { el.load(); } catch (e) { fin(); }
      setTimeout(fin, timeoutMs);   // 兜底，绝不卡住流程
    });
  }

  function preloadAct34() {
    if (!preload34) {
      preload34 = Promise.all([Promise.all(ACT34_IMAGES.map(loadImage)), loadVideo()]);
    }
    return preload34;
  }

  // 第五幕素材（静态图）：在第四幕末尾转场期间并行预取。
  // 视频只是「体检用」的冗余挂载 —— 给 video5 注入 src 但不等待（不阻塞流程）。
  function preloadAct5() {
    if (!preload5) {
      try {
        if (!video5.getAttribute('src')) { video5.src = VIDEO5_SRC; video5.load(); }
      } catch (e) { /* ignore */ }
      preload5 = Promise.all(ACT5_IMAGES.map(loadImage));
    }
    return preload5;
  }

  /* ================= 打字机 ================= */
  function typeText(text, speed, target) {
    speed = speed || TYPE_SPEED;
    target = target || chatText;
    busy = true;
    var my = ++typeToken;
    target.textContent = '';

    return new Promise(function (resolve) {
      var startT = null;
      var shown = 0;

      function frame(t) {
        if (my !== typeToken) {           // 被打断
          busy = false;
          return resolve(false);
        }
        if (startT === null) startT = t;

        var n = Math.floor((t - startT) / speed);
        if (n > text.length) n = text.length;

        if (n !== shown) {
          shown = n;
          target.textContent = text.slice(0, n);
        }
        if (shown >= text.length) {
          busy = false;
          return resolve(true);
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });
  }

  /* ================= 第三幕：贴纸玩法（核心） ================= */

  // 把「中心点」换算成跟随层的 transform（贴纸以中心对齐光标）
  function xf(cx, cy, scale) {
    return 'translate3d(' + (cx - STICKER_W / 2) + 'px,' + (cy - STICKER_H / 2) + 'px,0)' +
           (scale === undefined ? '' : ' scale(' + scale + ')');
  }

  // ① 选中升起 → 转为跟随光标
  function startPlacing(item, at) {
    item.used = true;
    item.el.classList.add('used');            // 面板中置灰，不再可点（Q15）

    var slotCx = item.left + STICKER_W / 2;
    var slotCy = item.top + STICKER_H / 2;
    var p = at || { x: slotCx, y: slotCy };

    var img = document.createElement('img');
    img.src = item.src;
    img.alt = '';
    img.style.transition = 'none';
    img.style.transform = xf(slotCx, slotCy, 0.9);   // 起点 = 槽位（略缩 0.9，表示「拿起来了」）
    stickerCursor.appendChild(img);

    placing = { item: item, el: img, x: p.x, y: p.y };
    act3.classList.add('placing');
    act3.classList.toggle('on-body', inBody(p.x, p.y));

    requestAnimationFrame(function () {
      if (!placing || placing.el !== img) return;
      img.style.transition = 'transform ' + RISE_MS + 'ms ease-out';
      img.style.transform = xf(p.x, p.y, 0.9);
      setTimeout(function () {
        // 跟随时必须去掉过渡，否则每一帧都追赶，画面拖影
        if (placing && placing.el === img) img.style.transition = 'none';
      }, RISE_MS + 20);
    });
  }

  // ④ 取消：贴纸飞回原槽位并取消待放置（Q24），不计数
  function cancelPlacing(instant) {
    if (!placing) return;
    var p = placing;
    placing = null;
    act3.classList.remove('placing', 'on-body');

    p.item.used = false;
    p.item.el.classList.remove('used');       // 面板立刻恢复可点

    if (instant) { p.el.remove(); return; }

    p.el.style.transition = 'transform ' + FLY_MS + 'ms ease-out, opacity ' + FLY_MS + 'ms ease-out';
    p.el.style.transform = xf(p.item.left + STICKER_W / 2, p.item.top + STICKER_H / 2, 1);
    setTimeout(function () { p.el.remove(); }, FLY_MS + 30);
  }

  // ③ 落定：以点击点为中心贴上，随机旋转 −10°~+10°
  function placeSticker(p) {
    var item = placing.item;
    placing.el.remove();
    placing = null;
    act3.classList.remove('placing', 'on-body');

    var el = document.createElement('img');
    el.src = item.src;
    el.alt = '';
    el.className = 'placed';
    el.style.left = (p.x - STICKER_W / 2) + 'px';
    el.style.top = (p.y - STICKER_H / 2) + 'px';
    el.style.zIndex = String(10 + stickerCount);        // 后贴的压住先贴的
    var rot = (rotOverride === null) ? (Math.random() * 20 - 10) : rotOverride;
    el.style.setProperty('--rot', rot.toFixed(2) + 'deg');
    el.style.transform = 'rotate(' + rot.toFixed(2) + 'deg)';
    stickerLayer.appendChild(el);
    placed.push(el);

    stickerCount++;
    playSound();                                        // 落定再响一次
    updateOkState();
  }

  function updateOkState() {
    okReady = stickerCount >= OK_THRESHOLD;
    if (okReady) { btnOk.classList.remove('dim'); btnOk.classList.add('ready'); }
    else { btnOk.classList.add('dim'); btnOk.classList.remove('ready'); }
  }

  // RESET：清空箱身全部贴纸 + 调色板 12 张全部恢复 + 计数归零 + 取消待放置
  function resetAll() {
    playSound();
    cancelPlacing(true);
    placed.forEach(function (el) { el.remove(); });
    placed = [];
    stickerCount = 0;
    palettes.forEach(function (it) { it.used = false; it.el.classList.remove('used'); });
    updateOkState();
  }

  function flushCursor() {
    rafPending = false;
    if (!placing) return;
    placing.el.style.transform = xf(placing.x, placing.y, 0.9);
    act3.classList.toggle('on-body', inBody(placing.x, placing.y));
  }

  function bindStickerPlay() {
    // 面板贴纸：点击进入待放置态（若手上已有，先让它飞回槽位）
    palettes.forEach(function (item) {
      item.el.addEventListener('click', function () {
        if (busy || animLock || act3Done || item.used) return;
        playSound();                                   // 选中响一次
        if (placing) cancelPlacing(true);
        startPlacing(item, lastPointer);
      });
    });

    // 跟随光标：pointermove 只记录坐标，真正改样式交给 rAF 节流
    stage.addEventListener('pointermove', function (e) {
      var p = toStage(e);
      lastPointer = p;
      if (!placing) return;
      placing.x = p.x;
      placing.y = p.y;
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(flushCursor);
    });

    // 落点判定：点击点（= 贴纸中心）落在箱身内 → 贴上；否则飞回取消（Q24）
    stage.addEventListener('click', function (e) {
      if (busy || animLock || act3Done || !placing) return;
      var t = e.target;
      if (t && t.closest && t.closest('.palette')) return;                       // 面板贴纸自己处理（切换目标）
      if (t && t.closest && t.closest('#btn-ok, #btn-reset, #btn-go3')) return;  // 按钮各自处理

      var p = toStage(e);
      animLock = true;
      if (inBody(p.x, p.y)) placeSticker(p);
      else cancelPlacing(false);
      setTimeout(function () { animLock = false; }, FLY_MS);
    });

    btnReset.addEventListener('click', function () {
      if (busy || act3Done) return;
      resetAll();
    });
  }

  /* ================= 第三幕流程 ================= */

  // A1：自动播放视频。返回 true = 真的播起来了；false = 不可用，走降级路径
  function playVideo() {
    return playVideoEl(video);
  }

  // 通用：播放某个已就绪的 <video>，返回是否成功开播（失败返回 false，由调用方走降级）
  function playVideoEl(el) {
    return new Promise(function (resolve) {
      var done = false;
      function fin(ok) { if (done) return; done = true; resolve(ok); }

      if (el.readyState >= 2) {           // 预加载已完成，直接开播
        try { el.currentTime = 0; } catch (e) {}
        try { el.play(); } catch (e) {}
        el.classList.add('in');
        return fin(true);
      }

      el.classList.add('in');
      var p = null;
      try { p = el.play(); } catch (e) { p = null; }
      if (p && typeof p.catch === 'function') p.catch(function () { fin(false); });

      el.addEventListener('playing', function onPlaying() {
        el.removeEventListener('playing', onPlaying);
        fin(true);
      });
      setTimeout(function () { fin(false); }, 3000);   // 3s 未就绪 → 降级，绝不让流程卡死
    });
  }

  function runAct3Intro() {
    return Promise.resolve()

      // A1-1 黑幕停留 500ms（三、四幕素材已在并行预加载）
      .then(function () { return sleep(500); })

      // A1-2 进入第三幕并自动播放（Q11）
      .then(function () {
        act3.classList.add('active');
        return playVideo();
      })

      // A1-3 黑幕 400ms 淡出露出视频；同时挂 .guard —— 透明但仍拦截点击
      .then(function (played) {
        blackout.classList.add('fast');
        return anim(400, function () {
          blackout.classList.remove('in');
          blackout.classList.add('guard');
        }).then(function () { return played; });
      })

      // A1-4 视频结束 → 视频 250ms 淡出露出定格图；降级则直接定格
      .then(function (played) {
        if (!played) {
          video.classList.remove('in');
          try { video.pause(); } catch (e) {}
          return;
        }
        return once(video, 'ended').then(function () {
          return anim(250, function () { video.classList.remove('in'); });
        });
      })
      .then(function () { blackout.classList.remove('guard'); })

      // A2 定格 + 第三句对话（几何完全复用第二幕，screen3/chat.png 与 screen2 字节相同）
      .then(function () { return anim(600, function () { chat3.classList.add('in'); }); })
      .then(function () { return typeText(LINE3, TYPE_SPEED, chat3Text); })

      // A3 打完才出 GO；点击后整个对话框（含姓名牌）整体消失
      .then(function () { return anim(300, function () { btnGo3.classList.add('in'); }); })
      .then(function () { return waitClick(btnGo3); })
      .then(function () {
        btnGo3.classList.remove('in');
        chat3Text.textContent = '';
        return sleep(300);
      })
      .then(function () { return anim(400, function () { chat3.classList.add('out'); }); });
  }

  // A4 入场：面板 → 贴纸 → 按钮，顺序播放、互不重叠
  function runStickerPanelIntro() {
    return Promise.resolve()
      .then(function () { return anim(600, function () { stickerFrame.classList.add('in'); }); })
      .then(function () {
        // 12 张贴纸逐个错峰淡入（Q23）
        return new Promise(function (resolve) {
          palettes.forEach(function (it, i) {
            setTimeout(function () { it.el.classList.add('in'); }, i * STICKER_STAGGER_MS);
          });
          setTimeout(resolve, (palettes.length - 1) * STICKER_STAGGER_MS + STICKER_FADE_MS);
        });
      })
      .then(function () {
        return anim(500, function () {
          btnReset.classList.add('in');
          btnOk.classList.add('in');
          btnOk.classList.add('dim');     // 出现后默认置灰；贴纸数 ≥ 3 才由 updateOkState() 转可用
          setTimeout(function () {
            // 入场动画跑完后切成快速过渡，hover 才不迟钝
            btnReset.classList.add('settled');
            btnOk.classList.add('settled');
          }, 520);
        });
      });
  }

  // 玩法循环：事件驱动，等玩家点 OK。
  // 注意必须先解除演出锁 —— 否则 waitClick / 各点击监听里的 busy 判定会把点击全吞掉。
  function runStickerPlay() {
    busy = false;
    return new Promise(function (resolve) {
      btnOk.addEventListener('click', function onOk() {
        if (act3Done || !okReady) return;
        act3Done = true;
        btnOk.removeEventListener('click', onOk);
        playSound();
        cancelPlacing(true);        // 手上若还捏着一张，先取消，免得浮在蒙黑层之上
        resolve();
      });
    });
  }

  /* ================= 第四幕：目标达成 ================= */
  function runAct4() {
    // 第四幕整幕转为可见。此刻 #shadow / #goal01 / #continue 全都还是 opacity:0，
    // 所以这一步没有可见变化，真正的画面仍由下面逐个淡入。
    act4.classList.add('active');
    return Promise.resolve()
      // 第三幕 UI 整体淡出（shadow.png 是 70% 半透明，不淡出会透过蒙黑层若隐若现）
      .then(function () { return anim(300, function () { act3.classList.add('ui-out'); }); })
      .then(function () { return anim(600, function () { shadow.classList.add('in'); }); })
      // 落下 380ms（用户指定：从上到下快速落下），与 CSS transition 时长保持一致
      .then(function () { return anim(380, function () { goal01.classList.add('in'); }); })
      .then(function () { return anim(500, function () { btnContinue.classList.add('in'); }); })
      .then(function () {
        btnContinue.classList.add('ready');
        setTimeout(function () { btnContinue.classList.add('settled'); }, 520);
        return waitClick(btnContinue);          // Q20：点击 Continue 才转全黑，不自动延时
      })
      // 点击 Continue 的那一刻立刻停止 BGM（全片唯一停止点，需求 §3.5.1）：
      // 结尾是「音乐停 -> 画面黑」，随后的 700ms 渐入与静止黑屏全程无音乐。
      // ⚠️ Q32（v2.12 确认）：停止点保持原样，此后不再起播 —— 第五幕及后续各幕全程静音。
      .then(function () {
        preloadAct5();                 // 第五幕 9.5MB 与黑幕渐入并行预取（不阻塞）
        stopBGM();
      })
      .then(function () {
        blackout.classList.remove('fast');
        return anim(700, function () { blackout.classList.add('in'); });
      });
  }

  /* ================= 第五幕：古城堡（需求 §8） =================
     B1 视频 → B2/B3 户外两句对话 → B4 进室内 + 纸片亮相
     → B5/B6 室内两句对话 → B7 引导手 → B8 点纸片 → 黑幕转场（衔接第六幕）
     ⚠️ BGM 全程无动作（Q32）：早在第四幕点 Continue 时就已停止。
     ⚠️ 推进点共 4 处（btn-go5a × 2、btn-go5b × 2），每段独立，靠 busy 锁防连点。 */
  function runAct5() {
    // 幕容器转为可见（此刻 #act5-outdoor / #bg-inside 各自仍是 opacity:0，画面仍全黑）
    act5.classList.add('active');
    act5Done = true;

    return Promise.resolve()

      // B1 黑幕停留 500ms → 户外定格图淡入（不再播放视频，直接显示静帧）
      .then(function () { return sleep(500); })
      .then(function () {
        blackout.classList.add('fast');
        return anim(400, function () {
          outdoor5.classList.add('in');
          blackout.classList.remove('in');
          blackout.classList.add('guard');
        });
      })
      .then(function () { blackout.classList.remove('guard'); })

      // B2 户外对话 1：chat5a 自下而上滑入 → 打第 ④ 句 → 打完出 GO
      .then(function () { return anim(600, function () { chat5a.classList.add('in'); }); })
      .then(function () { return typeText(LINE4, TYPE_SPEED, chat5aText); })
      .then(function () { return anim(300, function () { btnGo5a.classList.add('in'); }); })

      // B3 点击 GO → 清空 ④ → 打 ⑤（同一对话框内换句，不重新滑入）
      .then(function () { return waitClick(btnGo5a); })
      .then(function () {
        btnGo5a.classList.remove('in');
        chat5aText.textContent = '';
        return sleep(300);
      })
      .then(function () { return typeText(LINE5, TYPE_SPEED, chat5aText); })
      .then(function () { return anim(300, function () { btnGo5a.classList.add('in'); }); })

      // B3 末 点击 GO → 隐藏按钮 → 清空 → 户外对话框整体淡出
      .then(function () { return waitClick(btnGo5a); })
      .then(function () {
        btnGo5a.classList.remove('in');
        chat5aText.textContent = '';
        return sleep(300);
      })
      .then(function () { return anim(400, function () { chat5a.classList.add('out'); }); })

      // B4 直接切室内（本轮用户要求）：户外定格图淡出 + bg-inside 淡入，同一时刻交叉，
      //     不加黑场 —— 中间不出现任何别的画面。
      .then(function () {
        return anim(400, function () {
          outdoor5.classList.remove('in');
          bgInside.classList.add('in');
        });
      })
      // 纸片淡入
      .then(function () { return anim(400, function () { btnPapers.classList.add('in'); }); })

      // B5 室内对话 1：chat5b 再次滑入 → 打第 ⑥ 句 → 打完出 GO
      .then(function () { return anim(600, function () { chat5b.classList.add('in'); }); })
      .then(function () { return typeText(LINE6, TYPE_SPEED, chat5bText); })
      .then(function () { return anim(300, function () { btnGo5b.classList.add('in'); }); })

      // B6 点击 GO → 清空 ⑥ → 打 ⑦（同为同一对话框内换句）
      .then(function () { return waitClick(btnGo5b); })
      .then(function () {
        btnGo5b.classList.remove('in');
        chat5bText.textContent = '';
        return sleep(300);
      })
      .then(function () { return typeText(LINE7, TYPE_SPEED, chat5bText); })
      .then(function () { return anim(300, function () { btnGo5b.classList.add('in'); }); })

      // B7 点击 GO → 隐藏按钮 → 清空 → 整个对话框（含姓名牌）整体淡出 → 引导手出现、纸片可点
      .then(function () { return waitClick(btnGo5b); })
      .then(function () {
        btnGo5b.classList.remove('in');
        chat5bText.textContent = '';
        return sleep(300);
      })
      .then(function () { return anim(400, function () { chat5b.classList.add('out'); }); })
      .then(function () {
        // 进入点击等待前必须先解除演出锁，否则 waitClick 里的 busy 判定会把点击全吞掉
        busy = false;
        return new Promise(function (resolve) {
          setTimeout(function () {
            hand5.classList.add('in');
            btnPapers.classList.add('clickable');
            resolve();
          }, 300);
        });
      })
      .then(function () { return waitClick(btnPapers); })

      // B8 点击纸片 → 引导手隐藏（纸片保留，Q38）→ 黑幕渐入 700ms → 转场（非终点）
      .then(function () {
        btnPapers.classList.remove('clickable');
        return anim(300, function () { hand5.classList.remove('in'); });
      })
      .then(function () {
        // BGM 无动作（Q32：早在第四幕末已停，第五幕全程静音）
        blackout.classList.remove('fast');
        return anim(700, function () { blackout.classList.add('in'); });
      })

      // B8 末 黑幕停留 500ms 作为转场（并行预加载第六幕素材），衔接第六幕
      //     第六幕玩法待用户描述，此处只留转场钩子，不接入任何元素。
      .then(function () { return sleep(500); });
  }

  /* ================= 主流程 ================= */
  function main() {
    return Promise.resolve()

      // 0. 预加载（期间纯黑）—— 只加载第一、二幕
      .then(preload)

      // 1. 第一幕：背景淡入
      .then(function () { return anim(400, function () { bgStart.classList.add('in'); }); })
      .then(function () { window.__njMarkBooted(); })   // 第一幕已出，撤销启动看门狗

      // 2. START 按钮淡入
      .then(function () { return sleep(400); })
      .then(function () { return anim(400, function () { btnStart.classList.add('in'); }); })

      // 3. 等待点击 START
      //    这一下点击是「开始游戏」，也是全片音乐的唯一起点（需求 §3.5.1）：
      //    点击音效与 BGM 起点重合，两者都响（音效在前，BGM 紧随起播）。
      .then(function () { return waitClick(btnStart); })
      .then(function () { startBGM(); })

      // 4. 交叉转场：第一幕淡出，第二幕（房间）淡入
      .then(function () {
        return anim(400, function () {
          act1.classList.add('out');
          act2.classList.add('in');
        });
      })

      // 5. 对话弹窗自下而上滑入并贴底
      .then(function () { return anim(600, function () { chat.classList.add('in'); }); })

      // 6. 打第 1 句
      .then(function () { return typeText(LINE1, TYPE_SPEED, chatText); })

      // 7. 打完才出现 GO 按钮
      .then(function () { return anim(300, function () { btnGo.classList.add('in'); }); })

      // 8. 等待第 1 次点击 GO
      .then(function () { return waitClick(btnGo); })

      // 9. 隐藏按钮 + 清空第一句
      .then(function () {
        btnGo.classList.remove('in');
        chatText.textContent = '';
        return sleep(300);
      })

      // 10. 行李箱出现（距右 50 / 距底 30，淡入 + 上浮）
      .then(function () { return anim(450, function () { suitcase.classList.add('in'); }); })

      // 11. 打第 2 句
      .then(function () { return typeText(LINE2, TYPE_SPEED, chatText); })

      // 12. 打完才再次出现 GO 按钮
      .then(function () { return anim(300, function () { btnGo.classList.add('in'); }); })

      // 13. 等待第 2 次点击 GO
      .then(function () { return waitClick(btnGo); })

      // 14. 隐藏按钮
      .then(function () { btnGo.classList.remove('in'); return sleep(300); })

      // 15. 整个对话弹窗（chat.png 画面 + Luna 姓名牌 + 台词文本）淡出消失
      .then(function () { return anim(400, function () { chat.classList.add('out'); }); })

      // 16. 然后引导手才出现，行李箱变为可点击
      .then(function () { return anim(300, function () { hand.classList.add('in'); }); })
      .then(function () {
        suitcase.classList.add('clickable');
        return waitClick(suitcase);
      })

      // 17. 点击行李箱：隐藏引导手
      .then(function () {
        suitcase.classList.remove('clickable');
        return anim(300, function () { hand.classList.remove('in'); });
      })

      // 18. 第二幕末尾：黑幕渐入 —— 本版起它是「转场」而非终点。
      //     同时提前起跑三、四幕的预加载（不阻塞）。
      .then(function () {
        preloadAct34();
        return anim(700, function () { blackout.classList.add('in'); });
      })

      // 19. 第三幕：视频 → 定格 → 第三句 → 面板入场 → 玩法循环 → 点 OK
      .then(bindStickerPlay)
      .then(runAct3Intro)
      .then(runStickerPanelIntro)
      .then(runStickerPlay)

      // 20. 第四幕：蒙黑 → Goal → Continue → 全黑（v2.12 起此黑屏是转场，衔接第五幕）
      .then(runAct4)

      // 21. 第五幕：视频 → 户外两句 → 进室内 → 室内两句 → 引导手 → 点纸片 → 黑幕转场
      .then(runAct5)

      .catch(function (err) {
        reportFailure('运行出错', (err && (err.stack || err.message)) || String(err));
      });
  }

  /* ================= 测试钩子（不影响正常表现） ================= */
  window.__nj = {
    setRotation: function (deg) { rotOverride = deg; },
    clearRotation: function () { rotOverride = null; },
    dropBox: function () { return DROP_BOX; },      // 「可显示范围」红框（画布坐标）
    dropCenter: function () { return DROP; },       // 由红框内缩得到的贴纸中心可落点区间
    body: function () { return DROP_BOX; },         // 旧名，语义等同 dropBox
    state: function () {
      return {
        count: stickerCount, okReady: okReady, placing: !!placing, act3Done: act3Done,
        busy: busy, animLock: animLock,
        booted: booted,                     // 第一幕是否已渲染（看门狗标记）
        fallbackShown: !!(fallbackBox && !fallbackBox.hidden),  // 是否显示了启动失败提示
        // 第五幕状态（需求 §8）—— 供测试断言，只读
        act5: {
          started: act5Done,                     // 第五幕是否已进入
          outdoorIn: outdoor5.classList.contains('in'),   // 户外定格图是否显示中
          videoReady: video5.readyState >= 2,
          videoEnded: video5.ended,
          chat5aIn: chat5a.classList.contains('in'),
          chat5bIn: chat5b.classList.contains('in'),
          papersIn: btnPapers.classList.contains('in'),
          papersClickable: btnPapers.classList.contains('clickable'),
          hand5In: hand5.classList.contains('in'),
          bgInsideIn: bgInside.classList.contains('in')
        },
        // BGM 状态（需求 §3.5 / Q27–Q30）—— 供测试断言，只读
        bgm: {
          ready: bgmReady,                  // 是否已完成加载（canplaythrough）
          wanted: bgmWanted,                // 玩家已点 START、应当正在响
          paused: bgm.paused,               // 是否暂停
          loop: bgm.loop,                   // Q28：应为 true
          volume: bgm.volume,               // Q27：应为 0.35
          currentTime: bgm.currentTime,     // Q29：跨幕不重启，此值应单调不减
          src: bgm.src
        },
        soundVolume: pool.length ? pool[0].volume : 0   // 点击音效音量（应为 0.85，不受 BGM 影响）
      };
    }
  };

  /* ================= 启动 ================= */
  try {
    fitStage();
    main();
  } catch (err) {
    reportFailure('初始化失败', (err && (err.stack || err.message)) || String(err));
  }

})();
</script>
